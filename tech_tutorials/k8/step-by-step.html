<script>
const SLIDES = [{"type": "title"}, {"type": "divider", "part": "Orientation", "track": "meta", "title": "How this deck works", "sub": "Navigation, tracks, and how the labs connect"}, {"type": "concept", "part": "Orientation", "track": "meta", "title": "Two tracks, one cluster", "bullets": ["Every slide is tagged Operational (teal), Security (rust), or Both (amber) \u2014 the same cluster, viewed from two jobs.", "Operational asks: does it run, scale, and recover?", "Security asks: what can go wrong, and what stops it?", "By the end you'll hold both views of the same object at once."], "note": null}, {"type": "concept", "part": "Orientation", "track": "meta", "title": "Navigating 200 slides", "bullets": ["Arrow keys or the buttons move forward and back \u2014 nothing auto-advances.", "The dropdown at the top jumps straight to any chapter.", "Quiz slides don't block progress \u2014 answer, read the explanation, keep going.", "\u201cTry it\u201d slides point back to a numbered lab in the field manual \u2014 same cluster, same tools."], "note": null}, {"type": "quiz", "part": "Orientation", "track": "meta", "q": "What do the three track colors on each slide represent?", "options": ["Difficulty level", "Which chapter you're in", "Whether the slide is Operational, Security, or Both", "Estimated read time"], "correct": 2, "explain": "Teal, rust, and amber tag whether a slide is about running the system, defending it, or both at once."}, {"type": "divider", "part": "1 \u00b7 Container foundations", "track": "meta", "title": "What Kubernetes is actually orchestrating", "sub": "Before the orchestra, meet the instruments"}, {"type": "concept", "part": "1 \u00b7 Container foundations", "track": "both", "title": "A container is not a tiny VM", "bullets": ["A container is one or more processes on the host, made to feel isolated using Linux namespaces (what it can see) and cgroups (what it can use).", "There is no separate kernel per container \u2014 every container on a node shares that node's one kernel.", "That shared kernel is exactly why container escapes matter: break the isolation and you're touching the host directly."], "note": null, "deeper": "## The security divide: VMs vs. containers\n\n| Feature | Virtual machine | Standard container |\n|---|---|---|\n| Isolation level | Hardware virtualization \u2014 the hypervisor cuts it off completely | OS-level \u2014 processes wrapped in software namespaces |\n| Kernel | Independent guest kernel per VM | Shared \u2014 every container uses the one host kernel |\n| Attack surface | Small \u2014 an attacker must break the hypervisor itself | Large \u2014 any host kernel vulnerability is in scope |\n| Blast radius | Contained to that one VM | A kernel panic from one container can crash the whole node |\n\n**Why the shared kernel matters.** If an attacker compromises an app inside a standard container, they're one kernel exploit away from the host. Find a local privilege-escalation bug, and there's no second kernel standing between them and root on the machine \u2014 and every other container on that node.\n\nBreaking out of a VM is a fundamentally harder problem: you have to compromise the hypervisor itself (KVM, ESXi, Hyper-V), which is a far more locked-down target than an arbitrary kernel syscall path.\n\n**The middle ground: sandboxed containers.** Because VMs are safer but containers are faster and lighter, the industry built a third option:\n\n- **Kata Containers / Firecracker** \u2014 spin up a stripped-down microVM per container, giving each one its own dedicated kernel at close-to-container speed.\n- **gVisor** \u2014 intercepts syscalls in a userspace sandbox between the container and the host kernel, without a full microVM.\n\n**The practical rule:** if you're running untrusted code \u2014 a multi-tenant platform where users upload arbitrary scripts, or an AI agent executing model-generated commands \u2014 standard containers aren't enough; reach for Kata or gVisor. If you're running your own trusted microservices, standard containers are fine, provided you still harden them (non-root, dropped capabilities, read-only filesystem)."}, {"type": "concept", "part": "1 \u00b7 Container foundations", "track": "ops", "title": "Image vs. container, precisely", "bullets": ["An image is a read-only, layered filesystem snapshot plus metadata (entrypoint, env, exposed ports).", "A container is a running instance of an image, with a writable layer on top.", "Layers are content-addressed and cached \u2014 this is why rebuilding with one changed line is fast, not a full rebuild."], "note": null}, {"type": "code", "part": "1 \u00b7 Container foundations", "track": "ops", "title": "See the layers yourself", "lang": "bash", "body": "docker history nginx:1.27\ndocker inspect nginx:1.27 --format='{{.RootFS.Layers}}'", "note": "Each layer corresponds to one instruction in the Dockerfile that changed the filesystem."}, {"type": "concept", "part": "1 \u00b7 Container foundations", "track": "sec", "title": "The isolation boundary, honestly", "bullets": ["Namespaces hide things (other processes, other mounts, other network interfaces) \u2014 they don't add a security wall by themselves.", "cgroups limit resource use \u2014 they don't prevent syscalls.", "Real hardening layers on top: seccomp (blocks syscalls), AppArmor/SELinux (restricts file/network access), and for the highest-risk workloads, a sandboxed runtime like gVisor."], "note": null}, {"type": "concept", "part": "1 \u00b7 Container foundations", "track": "ops", "title": "The Container Runtime Interface (CRI)", "bullets": ["Kubernetes doesn't run containers itself \u2014 it talks to a runtime through the CRI, a gRPC contract.", "containerd and CRI-O are the two runtimes you'll meet in production; Docker Engine itself was removed as a direct option in Kubernetes 1.24.", "This abstraction is why swapping the runtime under a cluster doesn't require rewriting your workloads."], "note": null}, {"type": "code", "part": "1 \u00b7 Container foundations", "track": "sec", "title": "Peek at the isolation yourself", "lang": "bash", "body": "lsns -t net,pid,mnt              # list active namespaces on the host\ncat /sys/fs/cgroup/cpu.max       # a container's actual CPU ceiling, if using cgroup v2", "note": "These aren't Kubernetes commands \u2014 they're the raw Linux primitives Kubernetes builds on top of."}, {"type": "quiz", "part": "1 \u00b7 Container foundations", "track": "meta", "q": "What actually provides the resource limiting for a container \u2014 CPU, memory caps?", "options": ["Namespaces", "cgroups", "The container image", "seccomp"], "correct": 1, "explain": "cgroups control what a process can use (CPU, memory, I/O); namespaces control what it can see."}, {"type": "divider", "part": "2 \u00b7 Control plane", "track": "meta", "title": "The brain, opened up", "sub": "Four processes, one job: keep desired state true"}, {"type": "concept", "part": "2 \u00b7 Control plane", "track": "both", "title": "The control loop, as a pattern", "bullets": ["Every control plane component runs the same loop: observe current state, compare to desired state, take one action to close the gap, repeat.", "This is why Kubernetes recovers from almost anything eventually \u2014 the loop just keeps running.", "It also means there's no single 'deploy' moment \u2014 a Deployment update is just a new desired state the loop reconciles toward."], "note": null}, {"type": "diagram", "part": "2 \u00b7 Control plane", "track": "both", "title": "The control loop, drawn", "svg": "<svg viewBox=\"0 0 480 220\" class=\"w-full max-w-md mx-auto\"><circle cx=\"240\" cy=\"110\" r=\"90\" fill=\"none\" stroke=\"#E2E5EA\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><rect x=\"180\" y=\"10\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#E8F0EF\" stroke=\"#1D4E4B\"/><text x=\"240\" y=\"37\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"13\" fill=\"#14181F\">Observe state</text><rect x=\"330\" y=\"90\" width=\"130\" height=\"44\" rx=\"8\" fill=\"#FBF2E1\" stroke=\"#8A5A12\"/><text x=\"395\" y=\"117\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"13\" fill=\"#14181F\">Compare to desired</text><rect x=\"180\" y=\"166\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#FBECE8\" stroke=\"#A8412B\"/><text x=\"240\" y=\"193\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"13\" fill=\"#14181F\">Take one action</text><rect x=\"10\" y=\"90\" width=\"130\" height=\"44\" rx=\"8\" fill=\"#F6F7F9\" stroke=\"#E2E5EA\"/><text x=\"75\" y=\"117\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"13\" fill=\"#14181F\">Repeat</text><path d=\"M290,54 L340,90\" stroke=\"#4B5563\" stroke-width=\"1.5\" marker-end=\"url(#dArrow)\"/><path d=\"M395,134 L300,166\" stroke=\"#4B5563\" stroke-width=\"1.5\" marker-end=\"url(#dArrow)\"/><path d=\"M180,188 L140,134\" stroke=\"#4B5563\" stroke-width=\"1.5\" marker-end=\"url(#dArrow)\"/><path d=\"M75,90 L180,40\" stroke=\"#4B5563\" stroke-width=\"1.5\" marker-end=\"url(#dArrow)\"/><defs><marker id=\"dArrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4B5563\"/></marker></defs></svg>", "note": "Every controller you'll meet \u2014 Deployment, ReplicaSet, Node \u2014 is this same four-step loop, watching one resource type."}, {"type": "concept", "part": "2 \u00b7 Control plane", "track": "both", "title": "kube-apiserver: the only door in", "bullets": ["Every read and write to cluster state \u2014 kubectl, controllers, kubelets \u2014 goes through the API server. Nothing talks to etcd directly except the API server.", "It's stateless by design, so you can run several replicas behind a load balancer for high availability.", "It's also the single highest-value target in the whole cluster \u2014 everything downstream trusts what it approves."], "note": null, "deeper": "## The API server isn't a monolith either\n\nEverything you send through it eventually resolves to a **REST resource under an API group** (`apps/v1`, `rbac.authorization.k8s.io/v1`, and so on) \u2014 this is what makes the API extensible.\n\n**The aggregation layer** lets you register an entirely separate API server that handles requests for specific paths, while still appearing as part of the same Kubernetes API to `kubectl`. The Metrics API (`metrics.k8s.io`) is a real example \u2014 `kubectl top` talks to the aggregated metrics-server API server, not the core one.\n\nThis is a different extension mechanism from a **CRD** (Part 21): a CRD adds a new resource type handled by the *same* API server and stored in the *same* etcd; an aggregated API server is a genuinely separate process, useful when you need custom storage or logic the built-in API machinery can't express.\n\n**Why this matters operationally:** an aggregated API server going down can take down a specific capability (like `kubectl top`) without affecting core cluster operations \u2014 a useful fact when triaging \"is this a real outage or a narrower failure.\""}, {"type": "code", "part": "2 \u00b7 Control plane", "track": "sec", "title": "See exactly what the API server enforces", "lang": "bash", "body": "kubectl get --raw /metrics | grep apiserver_admission\nkubectl api-resources --verbs=list --namespaced -o wide", "note": "Every admission plugin the API server runs shows up in these metrics \u2014 a live view of your checkpoints."}, {"type": "concept", "part": "2 \u00b7 Control plane", "track": "both", "title": "etcd: the cluster's only memory", "bullets": ["A distributed, strongly-consistent key-value store using the Raft consensus algorithm.", "Every object you've ever created \u2014 Pods, Secrets, ConfigMaps, RBAC rules \u2014 is a key in etcd.", "Raft needs a majority (quorum) to agree, which is why production etcd runs in odd numbers: 3 or 5 nodes, never 2 or 4."], "note": null, "deeper": "## What Raft actually guarantees, and what it doesn't\n\nRaft gives etcd **linearizable consistency** \u2014 every read reflects the most recent acknowledged write, cluster-wide. This is stronger (and more expensive) than the eventual consistency you'd get from something like DynamoDB, and it's exactly why etcd isn't meant to be used as a general-purpose application database.\n\n**The watch mechanism** is arguably more important operationally than the storage itself. Every controller in Part 2's control loop doesn't poll etcd \u2014 it opens a long-lived **watch** on the API server, which itself watches etcd, and gets pushed a stream of changes. This is why Kubernetes reacts to changes in milliseconds instead of on a polling interval, and also why a controller crash-looping on startup is often a sign it can't establish its watches, not that it can't read data once.\n\n**A practical warning:** etcd performs badly with large objects (a very large ConfigMap or a CRD instance with a huge spec) and with high write rates against a single key \u2014 both show up as generic-looking \"slow API server\" symptoms that actually trace back to etcd contention."}, {"type": "concept", "part": "2 \u00b7 Control plane", "track": "sec", "title": "If etcd leaks, everything leaks", "bullets": ["Secrets in etcd are base64-encoded, not encrypted, unless you explicitly enable encryption at rest.", "Anyone with etcd's data directory or a network path to its client port can read every Secret in the cluster.", "The fix: a KMS provider for envelope encryption, TLS on both client and peer connections, and network isolation to control-plane nodes only."], "note": null, "deeper": "## Envelope encryption, one layer deeper\n\n\"Enable a KMS provider\" compresses a few real moving parts:\n\n1. Kubernetes generates a **Data Encryption Key (DEK)** and uses it to encrypt the Secret's actual content.\n2. The DEK itself is encrypted by a **Key Encryption Key (KEK)** held in your cloud KMS (AWS KMS, GCP Cloud KMS, Azure Key Vault) or Vault.\n3. What's actually stored in etcd is the encrypted Secret content *plus* the encrypted DEK \u2014 never the KEK, and never a plaintext key.\n\n**Why the indirection matters:** the KEK never leaves the KMS. If someone steals your etcd data directory wholesale, they get ciphertext they can't decrypt without also compromising the KMS itself \u2014 a meaningfully harder bar than \"read the disk.\"\n\n**The gap people miss:** enabling encryption at rest going forward does **not** retroactively encrypt Secrets already stored in etcd. You have to explicitly rewrite them (`kubectl get secrets --all-namespaces -o json | kubectl replace -f -` is the common pattern) after turning encryption on, or they stay in whatever state they were created in."}, {"type": "diagram", "part": "2 \u00b7 Control plane", "track": "both", "title": "A request's four checkpoints", "svg": "<svg viewBox=\"0 0 900 130\" class=\"w-full\"><g font-family=\"Inter\" font-size=\"12\"><rect x=\"10\" y=\"40\" width=\"140\" height=\"55\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#E2E5EA\"/><text x=\"80\" y=\"72\" text-anchor=\"middle\" fill=\"#14181F\">kubectl apply</text><rect x=\"190\" y=\"40\" width=\"150\" height=\"55\" rx=\"8\" fill=\"#FBF2E1\" stroke=\"#8A5A12\"/><text x=\"265\" y=\"65\" text-anchor=\"middle\" fill=\"#14181F\">Authentication</text><text x=\"265\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" fill=\"#4B5563\">who are you?</text><rect x=\"380\" y=\"40\" width=\"150\" height=\"55\" rx=\"8\" fill=\"#FBF2E1\" stroke=\"#8A5A12\"/><text x=\"455\" y=\"65\" text-anchor=\"middle\" fill=\"#14181F\">Authorization</text><text x=\"455\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" fill=\"#4B5563\">RBAC allowed?</text><rect x=\"570\" y=\"40\" width=\"160\" height=\"55\" rx=\"8\" fill=\"#FBECE8\" stroke=\"#A8412B\"/><text x=\"650\" y=\"65\" text-anchor=\"middle\" fill=\"#14181F\">Admission</text><text x=\"650\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" fill=\"#4B5563\">mutate / validate</text><rect x=\"770\" y=\"40\" width=\"120\" height=\"55\" rx=\"8\" fill=\"#E8F0EF\" stroke=\"#1D4E4B\"/><text x=\"830\" y=\"72\" text-anchor=\"middle\" fill=\"#14181F\">etcd</text></g><g stroke=\"#4B5563\" stroke-width=\"1.5\" marker-end=\"url(#lArrow)\"><line x1=\"150\" y1=\"67\" x2=\"188\" y2=\"67\"/><line x1=\"340\" y1=\"67\" x2=\"378\" y2=\"67\"/><line x1=\"530\" y1=\"67\" x2=\"568\" y2=\"67\"/><line x1=\"730\" y1=\"67\" x2=\"768\" y2=\"67\"/></g><defs><marker id=\"lArrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4B5563\"/></marker></defs></svg>", "note": "A rejection at any one of these four stages means the request never touches etcd at all."}, {"type": "concept", "part": "2 \u00b7 Control plane", "track": "ops", "title": "kube-scheduler: matchmaking, not magic", "bullets": ["For each unscheduled Pod, the scheduler filters nodes that can't fit it (predicates), then scores the rest (priorities) to pick a winner.", "Common scoring factors: resource availability, affinity/anti-affinity rules, and spreading pods across failure domains.", "You can run a custom scheduler alongside the default one for specialized workloads like batch or GPU jobs."], "note": null}, {"type": "concept", "part": "2 \u00b7 Control plane", "track": "ops", "title": "kube-controller-manager: dozens of loops in one binary", "bullets": ["Bundles many independent controllers: the Deployment controller, ReplicaSet controller, Node controller, Job controller, and more.", "Each watches one resource type and reconciles it \u2014 the Deployment controller doesn't know or care how the Node controller works.", "This modularity is why adding a new workload type (a CRD) doesn't require touching existing controllers."], "note": null}, {"type": "concept", "part": "2 \u00b7 Control plane", "track": "ops", "title": "cloud-controller-manager: where cloud-specific code lives", "bullets": ["Talks to the cloud provider's API for things Kubernetes core doesn't know about: provisioning LoadBalancers, attaching disks, labeling nodes with cloud metadata.", "Keeping this separate from the core controller-manager is why the same Kubernetes works on AWS, GCP, on-prem, or your laptop."], "note": null}, {"type": "compare", "part": "2 \u00b7 Control plane", "track": "ops", "title": "Control plane HA, at a glance", "cols": ["Setup", "Single control-plane node", "3+ control-plane nodes (HA)"], "rows": [["API server", "Single point of failure", "Load-balanced replicas, any can serve"], ["etcd", "One copy, one bad disk away from data loss", "3 or 5 members, tolerates one node loss"], ["Scheduler / controller-manager", "Runs once", "Runs on all, but only one is 'leader' via leader election at a time"]], "note": null}, {"type": "quiz", "part": "2 \u00b7 Control plane", "track": "meta", "q": "Why does production etcd run with an odd number of members, like 3 or 5?", "options": ["Odd numbers use less disk", "Raft consensus needs a majority to agree, and odd counts avoid tie votes", "It's a Kubernetes API requirement", "Even numbers aren't supported by the software"], "correct": 1, "explain": "Raft needs (n/2)+1 nodes to agree. With an even number, a network split can leave two equal-sized groups with no majority."}, {"type": "bridge", "part": "2 \u00b7 Control plane", "title": "Now flip to the security lens", "body": "Everything above described how the control plane works. Here's the same four components, but asking: what happens if an attacker reaches them?"}, {"type": "concept", "part": "2 \u00b7 Control plane", "track": "sec", "title": "The control-plane attack surface, component by component", "bullets": ["API server compromised \u2192 full cluster compromise. This is why anonymous auth, TLS, and network restriction to it are non-negotiable.", "etcd compromised \u2192 every Secret exposed, unless encrypted at rest.", "Scheduler compromised \u2192 an attacker can steer their workload onto a node they already control, or onto a node holding sensitive data.", "controller-manager compromised \u2192 silent, cluster-wide creation, deletion, or scaling of workloads."], "note": null}, {"type": "lab", "part": "2 \u00b7 Control plane", "track": "meta", "labnum": "0", "labname": "Set up a local cluster", "note": "Before going further, stand up the cluster you'll use for every hands-on slide from here on \u2014 Lab 0 in the field manual."}, {"type": "divider", "part": "3 \u00b7 Node components", "track": "meta", "title": "The hands, opened up", "sub": "What actually runs your containers"}, {"type": "concept", "part": "3 \u00b7 Node components", "track": "ops", "title": "kubelet: the node's local agent", "bullets": ["Watches the API server for Pods assigned to its node, then drives the container runtime through the CRI to make them real.", "Continuously reports node and Pod status back to the API server \u2014 this is where 'Ready' and 'NotReady' come from.", "Runs probes (liveness, readiness, startup) locally and restarts containers that fail them, without waiting on the control plane."], "note": null}, {"type": "concept", "part": "3 \u00b7 Node components", "track": "sec", "title": "The kubelet's own API is a target", "bullets": ["The kubelet exposes its own HTTPS API on port 10250 \u2014 by default, some older/misconfigured setups leave it with anonymous read/write access.", "An exposed, unauthenticated kubelet API lets an attacker list every Secret-mounting Pod on the node and execute commands inside them.", "Fix: disable anonymous auth on the kubelet, and restrict its port with firewall rules or a NetworkPolicy-aware CNI."], "note": null}, {"type": "concept", "part": "3 \u00b7 Node components", "track": "ops", "title": "kube-proxy and Service networking", "bullets": ["Implements the virtual IP behavior of a Service by writing rules into the node's networking stack.", "Two common modes: iptables (older, simpler, scales worse with thousands of Services) and IPVS (faster, built for large clusters).", "kube-proxy doesn't touch NetworkPolicy \u2014 that enforcement is entirely the CNI plugin's job."], "note": null}, {"type": "concept", "part": "3 \u00b7 Node components", "track": "ops", "title": "Node lifecycle you'll actually use", "bullets": ["cordon marks a node unschedulable without touching what's already running there.", "drain evicts existing Pods gracefully (respecting PodDisruptionBudgets) before you take a node down for maintenance.", "taints repel Pods from a node unless the Pod has a matching toleration \u2014 the opposite direction from node affinity."], "note": null}, {"type": "code", "part": "3 \u00b7 Node components", "track": "ops", "title": "Safely take a node out of rotation", "lang": "bash", "body": "kubectl cordon node-3\nkubectl drain node-3 --ignore-daemonsets --delete-emptydir-data\n# ... do maintenance ...\nkubectl uncordon node-3", "note": null}, {"type": "concept", "part": "3 \u00b7 Node components", "track": "ops", "title": "Capacity vs. allocatable", "bullets": ["A node's Capacity is its full physical resources; Allocatable is what's actually available to Pods after reserving headroom for the OS and kubelet itself.", "The scheduler only ever schedules against Allocatable \u2014 a node that looks 'full' in Capacity terms may have simply hit its reserved headroom."], "note": null}, {"type": "concept", "part": "3 \u00b7 Node components", "track": "ops", "title": "Eviction under pressure", "bullets": ["When a node runs low on memory or disk, the kubelet proactively evicts Pods before the kernel's OOM killer would step in blindly.", "Eviction order follows QoS class: BestEffort first, then Burstable, Guaranteed last \u2014 the same classes from Part 11's resource model."], "note": null}, {"type": "quiz", "part": "3 \u00b7 Node components", "track": "meta", "q": "Which component is responsible for enforcing NetworkPolicy objects?", "options": ["kubelet", "kube-proxy", "The CNI plugin", "kube-scheduler"], "correct": 2, "explain": "kube-proxy handles Service virtual IPs; NetworkPolicy enforcement is entirely up to the CNI (Calico, Cilium, etc.) \u2014 some CNIs, like kind's default kindnet, don't enforce it at all."}, {"type": "divider", "part": "4 \u00b7 API & objects", "track": "meta", "title": "How 'kubectl apply' actually becomes reality", "sub": "Declarative state, not a script of commands"}, {"type": "concept", "part": "4 \u00b7 API & objects", "track": "both", "title": "Declarative beats imperative", "bullets": ["You declare desired state (\"3 replicas of this image\") \u2014 you never tell Kubernetes the steps to get there.", "This is what makes the system self-healing: the gap between desired and actual state is continuously re-closed, not just once at deploy time.", "It's also what makes GitOps possible later: Git holds the desired state, and a controller just keeps reconciling toward it."], "note": null}, {"type": "concept", "part": "4 \u00b7 API & objects", "track": "ops", "title": "Anatomy of every object", "bullets": ["apiVersion and kind identify the schema.", "metadata carries the name, namespace, labels, and annotations \u2014 labels are for selection, annotations are for information.", "spec is what you want; status is what the system observed \u2014 you write spec, the system writes status."], "note": null}, {"type": "concept", "part": "4 \u00b7 API & objects", "track": "ops", "title": "Labels and selectors are how everything connects", "bullets": ["A Service finds its Pods by label selector, not by name or IP.", "A Deployment's ReplicaSet finds its Pods the same way.", "This indirection is why you can swap which Pods a Service targets just by changing labels \u2014 no restart required."], "note": null}, {"type": "concept", "part": "4 \u00b7 API & objects", "track": "ops", "title": "Owner references and garbage collection", "bullets": ["A Deployment owns its ReplicaSets; a ReplicaSet owns its Pods \u2014 tracked via ownerReferences, not naming convention.", "Delete the owner, and dependents are garbage-collected automatically, cascading down the chain.", "This is why kubectl delete deployment also cleans up its ReplicaSets and Pods without you deleting them one by one."], "note": null}, {"type": "concept", "part": "4 \u00b7 API & objects", "track": "ops", "title": "API versioning is a deprecation contract", "bullets": ["Alpha (v1alpha1): may change or disappear anytime, disabled by default in production clusters.", "Beta (v1beta1): enabled by default, more stable, but still subject to change before General Availability.", "Stable (v1): backward-compatible for the life of the API \u2014 this is the version you build production automation against."], "note": null}, {"type": "quiz", "part": "4 \u00b7 API & objects", "track": "meta", "q": "A Service routes traffic to a set of Pods using...", "options": ["The Pods' IP addresses, hardcoded", "A label selector matched against Pod labels", "The Deployment name", "Pod creation timestamps"], "correct": 1, "explain": "Services never reference Pods by identity \u2014 only by matching labels, which is what lets the underlying Pods change freely."}, {"type": "divider", "part": "5 \u00b7 Workloads", "track": "meta", "title": "Choosing the right shape for the job", "sub": "Pods rarely stand alone"}, {"type": "concept", "part": "5 \u00b7 Workloads", "track": "ops", "title": "The Pod is the atomic unit, but rarely runs alone", "bullets": ["A Pod is one or more containers that share a network namespace and can share storage \u2014 think 'one logical instance of your app.'", "Sidecar pattern: a helper container (log shipper, proxy) running alongside the main one, sharing its lifecycle.", "Init containers: run to completion before the main containers start \u2014 for setup work that must finish first."], "note": null}, {"type": "diagram", "part": "5 \u00b7 Workloads", "track": "ops", "title": "One Pod, three container roles", "svg": "<svg viewBox=\"0 0 500 160\" class=\"w-full max-w-lg mx-auto\"><rect x=\"10\" y=\"10\" width=\"480\" height=\"140\" rx=\"10\" fill=\"#F6F7F9\" stroke=\"#E2E5EA\"/><text x=\"30\" y=\"32\" font-family=\"Inter\" font-size=\"11\" fill=\"#4B5563\">Pod (shares network + optionally storage)</text><rect x=\"30\" y=\"45\" width=\"130\" height=\"80\" rx=\"6\" fill=\"#FBF2E1\" stroke=\"#8A5A12\"/><text x=\"95\" y=\"75\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"11\" fill=\"#14181F\">Init container</text><text x=\"95\" y=\"92\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"9\" fill=\"#4B5563\">runs first, then exits</text><rect x=\"185\" y=\"45\" width=\"130\" height=\"80\" rx=\"6\" fill=\"#E8F0EF\" stroke=\"#1D4E4B\"/><text x=\"250\" y=\"75\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"11\" fill=\"#14181F\">Main container</text><text x=\"250\" y=\"92\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"9\" fill=\"#4B5563\">your application</text><rect x=\"340\" y=\"45\" width=\"130\" height=\"80\" rx=\"6\" fill=\"#FBECE8\" stroke=\"#A8412B\"/><text x=\"405\" y=\"75\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"11\" fill=\"#14181F\">Sidecar</text><text x=\"405\" y=\"92\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"9\" fill=\"#4B5563\">runs alongside, shares lifecycle</text></svg>", "note": null}, {"type": "concept", "part": "5 \u00b7 Workloads", "track": "ops", "title": "Deployment: the workhorse for stateless apps", "bullets": ["Manages a ReplicaSet, which manages Pods \u2014 you almost never create ReplicaSets directly.", "Rolling updates are controlled by maxSurge (how many extra Pods during rollout) and maxUnavailable (how many can be down).", "kubectl rollout undo reverts to the previous ReplicaSet instantly \u2014 the old one isn't deleted, just scaled to zero."], "note": null}, {"type": "concept", "part": "5 \u00b7 Workloads", "track": "ops", "title": "StatefulSet: when identity matters", "bullets": ["Pods get stable, predictable names (web-0, web-1, web-2) and stable storage that follows them across rescheduling.", "Scale-up and scale-down happen in strict order \u2014 web-1 won't start until web-0 is Ready.", "Use it for databases, queues, or anything where 'which instance am I' matters to the app itself."], "note": null, "deeper": "## OrderedReady isn't the only mode\n\nThe strict, one-at-a-time startup described in the main slide is StatefulSet's **default** pod management policy, called `OrderedReady`. There's a second option:\n\n- **`Parallel`** \u2014 all pods are created and terminated simultaneously, with no ordering guarantee at all.\n\n`Parallel` trades away the ordering guarantee for much faster scale-up and scale-down \u2014 appropriate when your application doesn't actually depend on startup order (many distributed databases handle out-of-order joins fine once they have stable network identity and storage, even if they don't need strict sequencing).\n\n**The identity that matters more than the order, in practice:** most of the real value of a StatefulSet is the stable network identity (`web-0.web.default.svc.cluster.local` always refers to the same logical replica) and the stable PersistentVolumeClaim per replica \u2014 not necessarily the ordering itself. If your workload only needs the former, `Parallel` is worth considering before assuming you need the slower default."}, {"type": "concept", "part": "5 \u00b7 Workloads", "track": "ops", "title": "DaemonSet: exactly one per node", "bullets": ["Guarantees one Pod copy on every node (or a matching subset) \u2014 automatically added to new nodes as they join.", "This is the mechanism behind node-level tools: log collectors, CNI plugins, and \u2014 as you'll see later \u2014 Falco."], "note": null}, {"type": "concept", "part": "5 \u00b7 Workloads", "track": "ops", "title": "Job and CronJob: run-to-completion work", "bullets": ["A Job runs a Pod until it succeeds a specified number of times, then stops \u2014 unlike a Deployment, it doesn't restart a Pod that finished successfully.", "CronJob wraps a Job with a schedule, same syntax as Unix cron.", "Both are exactly what kube-bench used in your first lab: run once, produce output, exit."], "note": null}, {"type": "concept", "part": "5 \u00b7 Workloads", "track": "ops", "title": "PodDisruptionBudget: protecting availability during voluntary disruption", "bullets": ["Sets a floor \u2014 minAvailable or maxUnavailable \u2014 that voluntary actions like kubectl drain must respect.", "It has no effect on involuntary disruption (a node crashing) \u2014 only on deliberate, coordinated operations.", "This is exactly what made your Part 3 drain example safe to run against a live Deployment."], "note": null}, {"type": "quiz", "part": "5 \u00b7 Workloads", "track": "meta", "q": "You need a database where each replica needs its own stable storage and a predictable name. Which workload type?", "options": ["Deployment", "DaemonSet", "StatefulSet", "Job"], "correct": 2, "explain": "StatefulSet is built for exactly this: stable identity and storage per replica, in a defined order."}, {"type": "divider", "part": "6 \u00b7 Networking", "track": "meta", "title": "Every Pod gets an IP \u2014 now what?", "sub": "The flat network model, then how to actually control it"}, {"type": "concept", "part": "6 \u00b7 Networking", "track": "both", "title": "The Kubernetes networking model, in three rules", "bullets": ["Every Pod gets its own IP address \u2014 no NAT between Pods, cluster-wide.", "Any Pod can reach any other Pod's IP directly, by default, regardless of which node they're on.", "Rule three is the security problem: 'by default' means wide open until you say otherwise."], "note": null}, {"type": "concept", "part": "6 \u00b7 Networking", "track": "ops", "title": "The CNI plugin makes the flat network real", "bullets": ["Kubernetes defines the networking model; the CNI plugin (Calico, Cilium, kindnet, AWS VPC CNI...) implements it.", "Some CNIs are minimal \u2014 connectivity only, no policy enforcement (kindnet).", "Others, like Calico and Cilium, add NetworkPolicy enforcement and much more (encryption, observability, L7 rules)."], "note": null}, {"type": "concept", "part": "6 \u00b7 Networking", "track": "ops", "title": "Services: four flavors, four use cases", "bullets": ["ClusterIP (default): a stable virtual IP reachable only inside the cluster.", "NodePort: exposes the Service on a static port on every node's IP \u2014 simple, rarely production-grade on its own.", "LoadBalancer: asks the cloud provider to provision a real external load balancer, targeting the Service.", "Headless (clusterIP: None): skips the virtual IP entirely, returning individual Pod IPs via DNS \u2014 what StatefulSets use."], "note": null}, {"type": "concept", "part": "6 \u00b7 Networking", "track": "ops", "title": "DNS: how Pods find each other by name", "bullets": ["CoreDNS runs as a cluster add-on and answers queries like my-service.my-namespace.svc.cluster.local.", "This is why hardcoded IPs are an anti-pattern \u2014 Pod IPs change constantly, but Service DNS names don't."], "note": null}, {"type": "concept", "part": "6 \u00b7 Networking", "track": "ops", "title": "Ingress and the newer Gateway API", "bullets": ["Ingress routes external HTTP(S) traffic to Services based on hostname and path \u2014 but the spec itself is thin, so behavior varies a lot by controller (NGINX, Traefik, cloud-native).", "Gateway API is the newer, more expressive, more portable replacement, splitting the role into Gateway (infrastructure) and protocol-specific Route resources like HTTPRoute (routing rules)."], "note": null}, {"type": "quiz", "part": "6 \u00b7 Networking", "track": "meta", "q": "Which Service type gives you individual Pod IPs via DNS instead of one shared virtual IP?", "options": ["ClusterIP", "NodePort", "LoadBalancer", "Headless"], "correct": 3, "explain": "Headless Services (clusterIP: None) skip the virtual IP and let DNS return each Pod's IP directly \u2014 exactly what StatefulSets rely on for stable per-replica addressing."}, {"type": "bridge", "part": "6 \u00b7 Networking", "title": "Now lock it down", "body": "A flat network was the operational default. Here's how you turn 'any pod can reach any pod' into 'only what I explicitly allowed.'"}, {"type": "concept", "part": "6 \u00b7 Networking", "track": "sec", "title": "NetworkPolicy, precisely", "bullets": ["A NetworkPolicy selects Pods (via podSelector) and then defines allowed ingress and/or egress \u2014 everything not explicitly allowed to a policy-selected Pod is denied.", "An empty podSelector ({}) means 'every Pod in this namespace.'", "policyTypes: [Ingress] with no rules underneath it is the default-deny pattern: select everyone, allow nothing."], "note": null, "deeper": "## The CNI you pick changes what \"NetworkPolicy\" actually means\n\nNetworkPolicy is a Kubernetes **API** \u2014 the enforcement is entirely up to the CNI plugin, and CNIs differ meaningfully in how they implement it:\n\n| CNI | Enforcement mechanism | Notable capability |\n|---|---|---|\n| Calico | iptables or eBPF (configurable) | Can enforce policy at the host firewall level, not just per-pod |\n| Cilium | eBPF natively | Supports L7-aware policy (HTTP method/path), not just L3/L4 |\n| kindnet (kind's default) | None | Creates the objects, enforces nothing |\n| AWS VPC CNI | Requires a separate add-on for policy enforcement | Not on by default |\n\n**The practical consequence:** \"I applied a NetworkPolicy\" and \"traffic is actually being blocked\" are two different claims. Always verify enforcement empirically (exactly what Lab 4 does) rather than trusting that the object being accepted means it's doing anything \u2014 this is the single most common false sense of security in Kubernetes network hardening."}, {"type": "concept", "part": "6 \u00b7 Networking", "track": "sec", "title": "Egress rules, and the DNS gotcha", "bullets": ["A NetworkPolicy with policyTypes: [Egress] and no rules blocks all outbound traffic too \u2014 including DNS lookups, which use UDP port 53.", "The most common Lab 4-style mistake: applying default-deny egress and then wondering why every Pod suddenly cannot resolve any hostname. Always explicitly allow egress to your DNS Service first."], "note": null}, {"type": "code", "part": "6 \u00b7 Networking", "track": "sec", "title": "The default-deny pattern, exactly", "lang": "yaml", "body": "apiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny\nspec:\n  podSelector: {}\n  policyTypes: [\"Ingress\"]", "note": "This alone blocks all inbound traffic to every Pod in the namespace. You then add specific allow policies on top."}, {"type": "diagram", "part": "6 \u00b7 Networking", "track": "sec", "title": "Before and after, visually", "svg": "<svg viewBox=\"0 0 500 160\" class=\"w-full max-w-lg mx-auto\"><g font-family=\"Inter\" font-size=\"11\" fill=\"#4B5563\"><text x=\"90\" y=\"20\" text-anchor=\"middle\" fill=\"#A8412B\">Flat network</text><text x=\"410\" y=\"20\" text-anchor=\"middle\" fill=\"#1D4E4B\">Default-deny + allow</text></g><g fill=\"#FBECE8\" stroke=\"#A8412B\"><circle cx=\"40\" cy=\"70\" r=\"18\"/><circle cx=\"90\" cy=\"110\" r=\"18\"/><circle cx=\"140\" cy=\"70\" r=\"18\"/></g><g stroke=\"#A8412B\" stroke-width=\"1.3\"><line x1=\"55\" y1=\"80\" x2=\"78\" y2=\"102\"/><line x1=\"102\" y1=\"102\" x2=\"125\" y2=\"80\"/><line x1=\"55\" y1=\"65\" x2=\"125\" y2=\"65\"/></g><g fill=\"#E8F0EF\" stroke=\"#1D4E4B\"><circle cx=\"360\" cy=\"70\" r=\"18\"/><circle cx=\"410\" cy=\"110\" r=\"18\"/><circle cx=\"460\" cy=\"70\" r=\"18\"/></g><line x1=\"375\" y1=\"80\" x2=\"398\" y2=\"102\" stroke=\"#1D4E4B\" stroke-width=\"1.3\"/></svg>", "note": "Left: every pod reaches every other pod. Right: only the one explicitly allowed connection survives after default-deny plus a scoped allow rule."}, {"type": "concept", "part": "6 \u00b7 Networking", "track": "sec", "title": "Service mesh and mTLS: the next layer up", "bullets": ["A service mesh (Istio, Linkerd) adds a sidecar proxy to every Pod, giving you mutual TLS between services without changing application code.", "mTLS means both sides prove identity \u2014 not just the client trusting the server, which is what ordinary TLS does.", "Meshes also give you fine-grained L7 policy (this service can call that endpoint) beyond what NetworkPolicy's L3/L4 rules allow."], "note": null}, {"type": "quiz", "part": "6 \u00b7 Networking", "track": "meta", "q": "What does a NetworkPolicy with podSelector: {} and no ingress rules under policyTypes: [Ingress] do?", "options": ["Allows all ingress traffic", "Denies all ingress traffic to every pod in the namespace", "Only affects egress", "Does nothing until a selector is added"], "correct": 1, "explain": "An empty selector matches every Pod; declaring the Ingress policy type with zero allow rules means nothing is allowed in."}, {"type": "lab", "part": "6 \u00b7 Networking", "track": "meta", "labnum": "4", "labname": "Prove a default-deny NetworkPolicy actually works", "note": "Go run it for real: create two Pods, confirm they can talk, apply default-deny, confirm they can't, then add a scoped allow rule back."}, {"type": "divider", "part": "7 \u00b7 Storage", "track": "meta", "title": "Making state survive a Pod's death", "sub": "Volumes, claims, and who provisions what"}, {"type": "concept", "part": "7 \u00b7 Storage", "track": "ops", "title": "Volumes vs. PersistentVolumes \u2014 a real distinction", "bullets": ["A plain Volume's lifecycle is tied to its Pod \u2014 delete the Pod, the volume (usually) goes with it.", "A PersistentVolume (PV) exists independently of any Pod \u2014 it's provisioned once and can outlive many Pods that use it.", "A PersistentVolumeClaim (PVC) is a Pod's request for storage \u2014 Kubernetes binds it to a matching PV."], "note": null}, {"type": "concept", "part": "7 \u00b7 Storage", "track": "ops", "title": "Dynamic provisioning removes the manual step", "bullets": ["A StorageClass defines how to provision storage on demand (which cloud disk type, replication, etc.).", "When a PVC references a StorageClass, a PV is created automatically to match it \u2014 no admin has to pre-create volumes.", "The CSI (Container Storage Interface) is the plugin contract that makes this portable across storage backends, the same way CRI works for runtimes."], "note": null}, {"type": "concept", "part": "7 \u00b7 Storage", "track": "sec", "title": "Storage is an attack surface too", "bullets": ["hostPath volumes mount a path from the node's filesystem directly into a Pod \u2014 powerful, and a common privilege-escalation route if allowed unrestricted.", "readOnlyRootFilesystem: true on a container means even a compromised process can't write new files or overwrite binaries on disk.", "For AI/ML workloads specifically: mount training datasets ReadOnlyMany when the workload doesn't need to write, to block tampering."], "note": null}, {"type": "concept", "part": "7 \u00b7 Storage", "track": "ops", "title": "CSI drivers, briefly, with a real one", "bullets": ["Every major storage backend \u2014 EBS, Persistent Disk, Azure Disk, Ceph \u2014 ships a CSI driver implementing the same create/attach/mount contract.", "This is why a StorageClass provisioner name like ebs.csi.aws.com is the only cloud-specific string in an otherwise fully portable PVC manifest."], "note": null}, {"type": "quiz", "part": "7 \u00b7 Storage", "track": "meta", "q": "What's the risk of allowing unrestricted hostPath volumes?", "options": ["Slower disk I/O", "A compromised container can read or write directly to the node's filesystem, aiding escape or persistence", "It uses more etcd storage", "It only affects logging"], "correct": 1, "explain": "hostPath breaks the container boundary intentionally \u2014 it's one of the most common privilege-escalation and node-compromise vectors when left unrestricted."}, {"type": "divider", "part": "8 \u00b7 Config & secrets", "track": "meta", "title": "Where your app's settings actually live", "sub": "And the one thing people assume Secrets do that they don't"}, {"type": "concept", "part": "8 \u00b7 Config & secrets", "track": "ops", "title": "ConfigMaps: configuration, not secrets", "bullets": ["Store non-sensitive config as key-value pairs, mountable as environment variables or files.", "Changing a ConfigMap doesn't automatically restart Pods using it \u2014 you need a rollout trigger or a tool that watches for changes."], "note": null}, {"type": "concept", "part": "8 \u00b7 Config & secrets", "track": "sec", "title": "The Secret myth, corrected", "bullets": ["A Kubernetes Secret is base64-encoded, not encrypted. Anyone who can read the Secret object (or etcd directly) can trivially decode it.", "base64 is an encoding for safely storing binary-ish data as text \u2014 it is not, and was never meant to be, a security control.", "Real protection requires encryption at rest (a KMS provider for etcd) plus RBAC restricting who can even read Secret objects."], "note": null, "deeper": "## Encryption at rest fixes one problem, not the whole problem\n\nEven with KMS-backed encryption at rest enabled, these paths still expose Secret contents in plaintext:\n\n- **`kubectl get secret -o yaml`** \u2014 decrypts and returns it to anyone with RBAC read access. Encryption at rest protects the etcd disk; it does nothing against a legitimately authorized `get`.\n- **etcd snapshots/backups** (Part 15.6) \u2014 unless the backup pipeline itself preserves and requires the KMS key, a stolen backup can be as exposed as an unencrypted one, depending on how it's stored.\n- **Logs and crash dumps** \u2014 an application that logs its own environment variables on startup, or a crash handler that dumps process memory, can leak a Secret regardless of how it was stored.\n\n**The honest layered picture:** encryption at rest stops \"someone stole the raw etcd disk.\" RBAC stops \"someone without permission tried to read it via the API.\" Neither stops \"someone with legitimate `get secrets` permission did something careless with what they read\" \u2014 that gap is what audit logging (Part 17) and external secrets managers with short-lived, scoped credentials are actually for."}, {"type": "concept", "part": "8 \u00b7 Config & secrets", "track": "sec", "title": "Mount as files, not environment variables", "bullets": ["Environment variables are easy to leak: they show up in crash dumps, get logged by mistake, and are visible to any process that can read /proc/<pid>/environ.", "Mounting a Secret as a file limits exposure and lets you control filesystem permissions on it directly."], "note": null}, {"type": "concept", "part": "8 \u00b7 Config & secrets", "track": "sec", "title": "External secrets managers close the remaining gap", "bullets": ["Vault, AWS Secrets Manager, and GCP Secret Manager keep the actual secret material outside etcd entirely.", "An operator (like External Secrets Operator) syncs them into Kubernetes Secrets just-in-time, with rotation handled centrally."], "note": null}, {"type": "concept", "part": "8 \u00b7 Config & secrets", "track": "ops", "title": "Secret types are not all the same shape", "bullets": ["Opaque is the generic default \u2014 arbitrary key-value data.", "kubernetes.io/tls expects exactly tls.crt and tls.key \u2014 used directly by Ingress controllers for TLS termination.", "kubernetes.io/dockerconfigjson holds registry credentials, referenced from a Pod's imagePullSecrets to pull from a private registry."], "note": null}, {"type": "quiz", "part": "8 \u00b7 Config & secrets", "track": "meta", "q": "What encoding does a standard Kubernetes Secret use by default?", "options": ["AES-256 encryption", "base64 \u2014 an encoding, not encryption", "RSA public-key encryption", "No encoding, plain text"], "correct": 1, "explain": "base64 just makes binary-safe text \u2014 it provides zero confidentiality on its own. Encryption at rest requires explicitly enabling a KMS provider."}, {"type": "divider", "part": "9 \u00b7 Identity & RBAC", "track": "meta", "title": "Proving who you are, then what you're allowed to do", "sub": "Authentication, then authorization \u2014 never the other order"}, {"type": "concept", "part": "9 \u00b7 Identity & RBAC", "track": "sec", "title": "Authentication: three common mechanisms", "bullets": ["Client certificates: issued to users or components, verified against a trusted CA \u2014 common for cluster admins and kubelet-to-API-server trust.", "Bearer tokens: including ServiceAccount tokens, now short-lived and audience-bound by default rather than permanent.", "OIDC: federates identity to an external provider (Okta, Google, Azure AD) \u2014 the standard for human users at scale."], "note": null}, {"type": "concept", "part": "9 \u00b7 Identity & RBAC", "track": "sec", "title": "ServiceAccounts: identity for workloads, not humans", "bullets": ["Every Pod runs as a ServiceAccount \u2014 if you don't specify one, it gets the namespace's default, which typically has no permissions but does exist.", "Modern Kubernetes issues short-lived, audience-scoped tokens for ServiceAccounts automatically \u2014 the old permanent-token Secrets are a legacy pattern to avoid."], "note": null}, {"type": "concept", "part": "9 \u00b7 Identity & RBAC", "track": "sec", "title": "RBAC's four objects", "bullets": ["Role: a set of permissions (verbs on resources), scoped to one namespace.", "ClusterRole: the same idea, but cluster-scoped \u2014 usable cluster-wide or bound within a single namespace.", "RoleBinding: grants a Role (or ClusterRole) to a subject, within one namespace.", "ClusterRoleBinding: grants a ClusterRole cluster-wide."], "note": null}, {"type": "diagram", "part": "9 \u00b7 Identity & RBAC", "track": "sec", "title": "How the four pieces connect", "svg": "<svg viewBox=\"0 0 640 100\" class=\"w-full\"><g font-family=\"Inter\" font-size=\"11\"><rect x=\"10\" y=\"25\" width=\"140\" height=\"50\" rx=\"7\" fill=\"#E8F0EF\" stroke=\"#1D4E4B\"/><text x=\"80\" y=\"55\" text-anchor=\"middle\" fill=\"#14181F\">Role / ClusterRole</text><rect x=\"250\" y=\"25\" width=\"140\" height=\"50\" rx=\"7\" fill=\"#FBF2E1\" stroke=\"#8A5A12\"/><text x=\"320\" y=\"45\" text-anchor=\"middle\" fill=\"#14181F\">(Cluster)RoleBinding</text><text x=\"320\" y=\"60\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4B5563\">connects the two</text><rect x=\"490\" y=\"25\" width=\"140\" height=\"50\" rx=\"7\" fill=\"#FBECE8\" stroke=\"#A8412B\"/><text x=\"560\" y=\"55\" text-anchor=\"middle\" fill=\"#14181F\">Subject</text></g><g stroke=\"#4B5563\" stroke-width=\"1.5\" marker-end=\"url(#rArrow)\"><line x1=\"150\" y1=\"50\" x2=\"248\" y2=\"50\"/><line x1=\"390\" y1=\"50\" x2=\"488\" y2=\"50\"/></g><defs><marker id=\"rArrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4B5563\"/></marker></defs></svg>", "note": "A Role by itself grants nothing \u2014 permissions only take effect once a Binding connects it to a user, group, or ServiceAccount."}, {"type": "code", "part": "9 \u00b7 Identity & RBAC", "track": "sec", "title": "A least-privilege Role, concretely", "lang": "yaml", "body": "apiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata:\n  namespace: payments\n  name: pod-reader\nrules:\n- apiGroups: [\"\"]\n  resources: [\"pods\"]\n  verbs: [\"get\", \"list\", \"watch\"]", "note": "No wildcards. Scoped to one namespace, one resource type, read-only verbs \u2014 this is what least privilege looks like in YAML."}, {"type": "concept", "part": "9 \u00b7 Identity & RBAC", "track": "sec", "title": "The wildcard trap", "bullets": ["resources: [\"*\"] or verbs: [\"*\"] in a ClusterRole is functionally close to cluster-admin \u2014 audit for these specifically.", "It's easy to accumulate wildcard roles over time as a 'just make it work' shortcut during development that never gets tightened before production."], "note": null, "deeper": "## Why wildcard RBAC keeps happening anyway\n\nThe most common real-world path to a wildcard ClusterRole isn't a lazy engineer \u2014 it's a **CI/CD service account** that legitimately needs broad permissions during initial setup (installing CRDs, creating namespaces, provisioning cross-namespace resources), which then never gets scoped down once the cluster is stable.\n\n**A concrete audit query worth running periodically:**\n\n```bash\nkubectl get clusterroles -o json | jq -r '\n  .items[] | select(\n    .rules[]? | (.resources[]? == \"*\" or .verbs[]? == \"*\")\n  ) | .metadata.name'\n```\n\nThis surfaces every ClusterRole with a wildcard resource or verb \u2014 not proof of a problem by itself (some legitimately need broad scope, like a monitoring agent reading everything read-only), but every result is worth a specific, named justification rather than being left unexamined.\n\n**The blast-radius question to ask for each hit:** if this ServiceAccount's token leaked today, what's the actual damage \u2014 and is that damage proportional to what the workload needs to do its job?"}, {"type": "concept", "part": "9 \u00b7 Identity & RBAC", "track": "sec", "title": "Two RBAC features worth knowing exist", "bullets": ["Aggregated ClusterRoles combine multiple ClusterRoles by label selector \u2014 useful for building composable permission sets that plugins can extend without editing a central role.", "Impersonation (the impersonate verb) lets one identity act as another for testing or automation \u2014 powerful, and exactly the kind of permission that deserves its own tight scope and audit trail."], "note": null}, {"type": "quiz", "part": "9 \u00b7 Identity & RBAC", "track": "meta", "q": "Which RBAC object grants permissions across the entire cluster, not just one namespace?", "options": ["Role", "RoleBinding", "ClusterRoleBinding bound to a ClusterRole", "A Role bound via RoleBinding"], "correct": 2, "explain": "A ClusterRole plus a ClusterRoleBinding is what grants cluster-wide scope. A Role, even bound cluster-wide via RoleBinding tricks, stays namespace-scoped by design."}, {"type": "divider", "part": "10 \u00b7 Admission & policy", "track": "meta", "title": "The last checkpoint before anything is saved", "sub": "Where 'it's technically allowed by RBAC' still gets rejected"}, {"type": "concept", "part": "10 \u00b7 Admission & policy", "track": "sec", "title": "The admission chain, in order", "bullets": ["After authentication and authorization succeed, every write request passes through mutating admission webhooks first, then validating ones.", "Mutating webhooks can change the request (inject a sidecar, add a label); validating webhooks can only accept or reject it.", "This is the checkpoint that runs even for a request RBAC already approved \u2014 'allowed' and 'wise' are different questions."], "note": null}, {"type": "concept", "part": "10 \u00b7 Admission & policy", "track": "sec", "title": "Built-in admission controllers you rely on daily", "bullets": ["NodeRestriction limits what a kubelet can modify \u2014 without it, a compromised kubelet could edit any Node or Pod object.", "ResourceQuota enforces namespace-level caps on CPU, memory, and object counts.", "PodSecurity is what enforces the Pod Security Standards you saw earlier \u2014 Privileged, Baseline, Restricted."], "note": null}, {"type": "concept", "part": "10 \u00b7 Admission & policy", "track": "sec", "title": "Policy-as-code: two dominant approaches", "bullets": ["OPA/Gatekeeper: general-purpose, policies written in Rego, flexible but with a steeper learning curve.", "Kyverno: Kubernetes-native, policies are plain YAML, faster to write for common cases like 'block privileged containers.'", "Both work the same way structurally: a validating (and optionally mutating) admission webhook backed by your policy engine."], "note": null}, {"type": "quiz", "part": "10 \u00b7 Admission & policy", "track": "meta", "q": "What's the difference between mutating and validating admission webhooks?", "options": ["No difference, they run the same checks", "Mutating can change the request; validating can only accept or reject it", "Validating runs first, then mutating", "Mutating only applies to Secrets"], "correct": 1, "explain": "Mutating webhooks run first and may modify the incoming object; validating webhooks run after and make a pure accept/reject decision."}, {"type": "lab", "part": "10 \u00b7 Admission & policy", "track": "meta", "labnum": "3", "labname": "Block privileged containers with Kyverno", "note": "Apply a real Kyverno ClusterPolicy, then try to deploy a privileged pod and watch the admission webhook reject it."}, {"type": "divider", "part": "11 \u00b7 Scheduling", "track": "meta", "title": "Getting the right pod onto the right node", "sub": "And keeping one workload from starving the rest"}, {"type": "concept", "part": "11 \u00b7 Scheduling", "track": "ops", "title": "Requests vs. limits, and why both matter", "bullets": ["A request is what the scheduler reserves for a container \u2014 it's the basis for 'does this Pod fit on this node.'", "A limit is the hard ceiling \u2014 exceed a memory limit and the container is OOMKilled; exceed a CPU limit and it's throttled, not killed.", "No requests/limits set at all means the Pod can consume unbounded resources and starve its neighbors."], "note": null}, {"type": "concept", "part": "11 \u00b7 Scheduling", "track": "ops", "title": "QoS classes fall out of requests and limits automatically", "bullets": ["Guaranteed: requests equal limits for every container \u2014 evicted last under node pressure.", "Burstable: requests set but lower than limits \u2014 evicted before Guaranteed.", "BestEffort: no requests or limits at all \u2014 evicted first."], "note": null}, {"type": "concept", "part": "11 \u00b7 Scheduling", "track": "ops", "title": "Steering pods: affinity, anti-affinity, taints, tolerations", "bullets": ["Node affinity: 'schedule me on nodes with this label' \u2014 a pull.", "Pod anti-affinity: 'don't schedule me next to another pod like me' \u2014 spreads replicas across failure domains.", "Taints and tolerations: the opposite direction \u2014 a node repels pods unless they explicitly tolerate the taint."], "note": null}, {"type": "concept", "part": "11 \u00b7 Scheduling", "track": "ops", "title": "Autoscaling, three layers", "bullets": ["Horizontal Pod Autoscaler (HPA): adds or removes Pod replicas based on observed metrics like CPU.", "Vertical Pod Autoscaler (VPA): adjusts a Pod's requests/limits over time based on observed usage.", "Cluster Autoscaler: adds or removes nodes themselves when Pods can't be scheduled or nodes sit empty."], "note": null}, {"type": "concept", "part": "11 \u00b7 Scheduling", "track": "ops", "title": "PriorityClass and preemption", "bullets": ["A PriorityClass gives Pods a relative importance value the scheduler uses when resources are tight.", "If a high-priority Pod cannot be scheduled otherwise, the scheduler can preempt (evict) lower-priority Pods to make room \u2014 a deliberate, visible tradeoff, not a silent one."], "note": null}, {"type": "quiz", "part": "11 \u00b7 Scheduling", "track": "meta", "q": "A Pod has no resource requests or limits set. What QoS class does it get?", "options": ["Guaranteed", "Burstable", "BestEffort", "It won't be scheduled"], "correct": 2, "explain": "No requests or limits at all means BestEffort \u2014 the first class evicted under node resource pressure."}, {"type": "bridge", "part": "11 \u00b7 Scheduling", "title": "The security angle on resources", "body": "Everything above assumes cooperative workloads. Here's what happens when one isn't."}, {"type": "concept", "part": "11 \u00b7 Scheduling", "track": "sec", "title": "Resource exhaustion as an attack, and the AI/ML wrinkle", "bullets": ["A workload with no limits \u2014 malicious or just buggy \u2014 can consume enough CPU/memory to degrade or crash everything else on a node.", "GPU and TPU resources need the same discipline: without ResourceQuotas scoped specifically to accelerators, one runaway ML job can starve every other workload needing that hardware.", "This is exactly the accelerator-starvation threat covered in the AI/ML security chapter of the field manual."], "note": null}, {"type": "divider", "part": "12 \u00b7 Observability", "track": "meta", "title": "You can't secure or operate what you can't see", "sub": "Logs, metrics, and the checks that catch failures early"}, {"type": "concept", "part": "12 \u00b7 Observability", "track": "ops", "title": "Where logs actually come from", "bullets": ["Container stdout/stderr is captured by the container runtime and written to the node's disk.", "A node-level agent (often a DaemonSet like Fluent Bit) tails those files and ships them to a central store.", "This is exactly why DaemonSets matter operationally, not just for security tools like Falco."], "note": null}, {"type": "concept", "part": "12 \u00b7 Observability", "track": "ops", "title": "Metrics: two different jobs", "bullets": ["metrics-server provides just enough data (CPU/memory) for the HPA and kubectl top to work \u2014 lightweight, not for dashboards.", "Prometheus scrapes detailed, custom metrics from your applications and infrastructure \u2014 the actual observability backbone for dashboards and alerting."], "note": null}, {"type": "concept", "part": "12 \u00b7 Observability", "track": "ops", "title": "Probes: how Kubernetes knows a Pod is actually working", "bullets": ["Liveness probe: 'is this container still alive' \u2014 fail it enough times and Kubernetes restarts the container.", "Readiness probe: 'is this container ready to receive traffic' \u2014 fail it and the Pod is pulled from Service endpoints, but not restarted.", "Startup probe: gives slow-starting containers extra time before liveness checks even begin, avoiding a restart loop on legitimately slow boots."], "note": null}, {"type": "quiz", "part": "12 \u00b7 Observability", "track": "meta", "q": "A container is running but not yet ready to serve traffic during a slow startup. Which probe result pulls it from load-balancing without restarting it?", "options": ["Failing liveness", "Failing readiness", "Failing startup", "No probe does this"], "correct": 1, "explain": "Readiness controls Service membership; failing it removes the Pod from traffic without touching its lifecycle \u2014 that's exactly its job."}, {"type": "concept", "part": "12 \u00b7 Observability", "track": "ops", "title": "The third pillar: distributed tracing", "bullets": ["Logs tell you what happened in one place; metrics tell you the aggregate trend; traces tell you the path a single request took across many services.", "In a microservices architecture, a slow user request might touch a dozen Pods \u2014 tracing is what lets you find which one actually caused the delay."], "note": null}, {"type": "code", "part": "12 \u00b7 Observability", "track": "ops", "title": "The debugging toolbox you'll actually reach for", "lang": "bash", "body": "kubectl describe pod <name>        # events: why is it Pending/CrashLooping\nkubectl logs <name> -c <container> --previous  # logs from before the last restart\nkubectl exec -it <name> -- sh      # a shell inside a running container\nkubectl debug <name> -it --image=busybox --target=<container>  # ephemeral debug container, no image rebuild", "note": "kubectl debug is the modern answer to 'this minimal image has no shell to exec into.'"}, {"type": "divider", "part": "13 \u00b7 Runtime security", "track": "meta", "title": "Watching what actually happens, not just what's configured", "sub": "Because a perfectly hardened manifest can still be exploited at runtime"}, {"type": "concept", "part": "13 \u00b7 Runtime security", "track": "sec", "title": "Why runtime detection is a different job than scanning", "bullets": ["Image scanning catches known vulnerabilities before deployment \u2014 it says nothing about what happens after a container starts running.", "Runtime security watches live behavior: syscalls, file access, network connections \u2014 catching zero-days and misuse that no scanner could have flagged in advance."], "note": null}, {"type": "concept", "part": "13 \u00b7 Runtime security", "track": "sec", "title": "eBPF, in plain terms", "bullets": ["Extended Berkeley Packet Filter: a way to run small, sandboxed programs inside the Linux kernel itself, safely, without writing a kernel module.", "It can observe every syscall a process makes with very low overhead \u2014 the foundation for modern runtime security tooling.", "'Compile Once, Run Everywhere' (CO-RE) is what lets a single eBPF program work across many kernel versions without recompiling per-host."], "note": null}, {"type": "concept", "part": "13 \u00b7 Runtime security", "track": "sec", "title": "Falco's architecture", "bullets": ["A driver (kernel module, classic eBPF, or the modern eBPF probe) captures raw syscall events from the kernel.", "Falco's userspace engine matches those events against rules \u2014 human-readable conditions like 'a shell was spawned inside a container.'", "Since Falco 0.38.0, modern_ebpf is the default driver \u2014 CO-RE means it works across kernel versions \u22655.8 without a matching prebuilt binary."], "note": null, "deeper": "## Driver choice is a real tradeoff, not just a version number\n\n| Driver | How it works | Tradeoff |\n|---|---|---|\n| Kernel module (kmod) | Compiled against your exact kernel | Fastest, but must be rebuilt per kernel version \u2014 brittle across upgrades |\n| Classic eBPF | Pre-compiled per kernel version | No compilation needed, but still version-pinned |\n| Modern eBPF (default since 0.38.0) | Uses CO-RE to adapt at load time | Works across kernel versions \u22655.8 without a matching prebuilt binary \u2014 the reason it's now the default |\n\n**The tuning problem nobody mentions upfront:** Falco's default rule set is deliberately broad, which means a fresh install on a real cluster typically produces a wave of false positives \u2014 package managers running during image builds, legitimate debugging shells, CI runners. The real work of adopting Falco isn't installing it; it's writing **exception conditions** into your rules for your cluster's actual normal behavior, so the alerts that remain are ones worth waking someone up for."}, {"type": "code", "part": "13 \u00b7 Runtime security", "track": "sec", "title": "A Falco rule, read literally", "lang": "yaml", "body": "- rule: Terminal shell in container\n  desc: A shell was spawned inside a container\n  condition: spawned_process and container and shell_procs\n  output: \"Shell in container (user=%user.name container=%container.name)\"\n  priority: WARNING", "note": "condition is a boolean expression over the event stream; output is the templated alert Falco emits when it matches."}, {"type": "diagram", "part": "13 \u00b7 Runtime security", "track": "sec", "title": "From syscall to alert", "svg": "<svg viewBox=\"0 0 820 110\" class=\"w-full\"><g font-family=\"Inter\" font-size=\"11\"><rect x=\"10\" y=\"30\" width=\"150\" height=\"50\" rx=\"7\" fill=\"#F6F7F9\" stroke=\"#E2E5EA\"/><text x=\"85\" y=\"60\" text-anchor=\"middle\" fill=\"#14181F\">Linux kernel</text><rect x=\"200\" y=\"30\" width=\"150\" height=\"50\" rx=\"7\" fill=\"#E8F0EF\" stroke=\"#1D4E4B\"/><text x=\"275\" y=\"55\" text-anchor=\"middle\" fill=\"#14181F\">modern_ebpf driver</text><text x=\"275\" y=\"70\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4B5563\">captures syscalls</text><rect x=\"390\" y=\"30\" width=\"150\" height=\"50\" rx=\"7\" fill=\"#E8F0EF\" stroke=\"#1D4E4B\"/><text x=\"465\" y=\"55\" text-anchor=\"middle\" fill=\"#14181F\">Falco engine</text><text x=\"465\" y=\"70\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4B5563\">matches rules</text><rect x=\"580\" y=\"30\" width=\"220\" height=\"50\" rx=\"7\" fill=\"#FBECE8\" stroke=\"#A8412B\"/><text x=\"690\" y=\"55\" text-anchor=\"middle\" fill=\"#14181F\">Alert output</text><text x=\"690\" y=\"70\" text-anchor=\"middle\" font-size=\"9\" fill=\"#4B5563\">log, Slack, webhook, SIEM</text></g><g stroke=\"#4B5563\" stroke-width=\"1.5\" marker-end=\"url(#fArrow)\"><line x1=\"160\" y1=\"55\" x2=\"198\" y2=\"55\"/><line x1=\"350\" y1=\"55\" x2=\"388\" y2=\"55\"/><line x1=\"540\" y1=\"55\" x2=\"578\" y2=\"55\"/></g><defs><marker id=\"fArrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#4B5563\"/></marker></defs></svg>", "note": null}, {"type": "concept", "part": "13 \u00b7 Runtime security", "track": "sec", "title": "Layering further: seccomp, AppArmor/SELinux, sandboxed runtimes", "bullets": ["seccomp filters which syscalls a container can make at all \u2014 most containers never need mount() or reboot(), so blocking them costs nothing functionally.", "AppArmor/SELinux add mandatory access control on top: which files, network resources, and capabilities a process may touch.", "For the highest-risk workloads \u2014 untrusted code, AI inference agents \u2014 gVisor or Kata Containers add a full syscall interception layer between the container and the real kernel."], "note": null}, {"type": "quiz", "part": "13 \u00b7 Runtime security", "track": "meta", "q": "What is Falco's currently default driver, and why does it work across many kernel versions without recompiling?", "options": ["The kernel module (kmod) \u2014 it's the oldest and most compatible", "modern_ebpf, via a CO-RE feature that adapts to the running kernel", "A userspace-only ptrace hook", "It requires a different driver build for every kernel"], "correct": 1, "explain": "modern_ebpf is bundled into the userspace binary and uses eBPF's CO-RE (Compile Once, Run Everywhere) to adapt to the kernel it's running on."}, {"type": "concept", "part": "13 \u00b7 Runtime security", "track": "sec", "title": "Falco is not the only option", "bullets": ["Tetragon (from the Cilium project) takes a similar eBPF-based approach but is more tightly integrated with Cilium's networking layer, enabling enforcement \u2014 not just detection \u2014 at the kernel level.", "The evaluation question is the same either way: does it support the modern eBPF approach, and can your team actually write and maintain its rule language."], "note": null}, {"type": "lab", "part": "13 \u00b7 Runtime security", "track": "meta", "labnum": "5", "labname": "Trigger and observe a Falco alert", "note": "Install Falco with the modern eBPF driver, spawn a shell inside a running container, and watch the alert appear in real time."}, {"type": "divider", "part": "14 \u00b7 Supply chain", "track": "meta", "title": "Securing what goes into the image, before it ever runs", "sub": "Because a hardened runtime can't fix a poisoned build"}, {"type": "concept", "part": "14 \u00b7 Supply chain", "track": "sec", "title": "Build-time hygiene", "bullets": ["Multi-stage builds keep build tools (compilers, package managers) out of the final image entirely \u2014 smaller image, smaller attack surface.", "Distroless or minimal base images remove shells and package managers a compromised process could otherwise use to persist or pivot.", "Pin base image versions by digest, not just tag \u2014 tags can be repointed; digests can't."], "note": null}, {"type": "concept", "part": "14 \u00b7 Supply chain", "track": "sec", "title": "Vulnerability scanning, mechanically", "bullets": ["A scanner like Trivy reads the image's layers and package manifests, then checks each package version against known-CVE databases.", "Severity gates (fail the build on CRITICAL/HIGH) turn a scan from advisory into enforcement \u2014 the difference between a report nobody reads and a blocked pipeline."], "note": null}, {"type": "concept", "part": "14 \u00b7 Supply chain", "track": "sec", "title": "Image signing and SBOMs", "bullets": ["Cosign (part of Sigstore) signs an image so that a signature-verifying admission controller can reject any image not signed by a trusted identity.", "A Software Bill of Materials (SBOM) is a machine-readable manifest of every package and version in an image \u2014 essential for answering 'are we affected by this new CVE' in minutes instead of days."], "note": null, "deeper": "## SLSA: putting a number on \"how trustworthy is this build\"\n\nThe Supply-chain Levels for Software Artifacts (SLSA) framework gives supply-chain security a maturity scale, similar in spirit to the CIS maturity model in Part 17:\n\n| Level | What it requires |\n|---|---|\n| SLSA 1 | The build process is scripted and produces provenance metadata \u2014 but that metadata isn't verified |\n| SLSA 2 | Provenance is generated by a hosted build service and is tamper-resistant |\n| SLSA 3 | The build runs in a hardened, isolated environment resistant to the build process itself being compromised |\n| SLSA 4 | Two-person review of all changes, plus a fully hermetic, reproducible build |\n\n**Where this connects to what you already have:** Cosign signatures and SBOMs are the *artifacts* that make SLSA levels verifiable \u2014 an admission controller checking for a valid signature (Part 10) is, in effect, enforcing a minimum SLSA bar at deploy time. Most startups realistically target SLSA 2 first \u2014 it's achievable with a standard hosted CI provider and doesn't require the isolated-build infrastructure SLSA 3 assumes."}, {"type": "quiz", "part": "14 \u00b7 Supply chain", "track": "meta", "q": "What does pinning a base image by digest (not just tag) actually protect against?", "options": ["Slower builds", "The tag being silently repointed to different, potentially compromised content later", "Larger image size", "Nothing \u2014 tags and digests are equivalent"], "correct": 1, "explain": "A tag like latest or even a version tag can be moved to point at new content. A digest is a cryptographic hash of the exact content \u2014 it cannot be silently changed."}, {"type": "lab", "part": "14 \u00b7 Supply chain", "track": "meta", "labnum": "2", "labname": "Gate a build with Trivy", "note": "Scan an old, vulnerable image and a current one, and watch the exit code flip from 1 to 0 \u2014 the exact check a CI pipeline would run."}, {"type": "divider", "part": "15 \u00b7 GitOps", "track": "meta", "title": "Automating everything covered so far", "sub": "Because none of it holds if a human has to remember to run it"}, {"type": "concept", "part": "15 \u00b7 GitOps", "track": "ops", "title": "GitOps, as a set of principles", "bullets": ["The entire desired state of the system is declared in Git \u2014 Git is the single source of truth, not a human's memory or a runbook.", "A controller (ArgoCD, Flux) continuously reconciles the live cluster to match Git \u2014 the same control-loop pattern from Part 2, applied to your deployments themselves.", "Rolling back is a git revert, not a manual set of kubectl commands run under pressure."], "note": null}, {"type": "concept", "part": "15 \u00b7 GitOps", "track": "ops", "title": "The reconciliation loop, concretely", "bullets": ["The GitOps controller polls (or is webhook-notified of) changes to a Git repo.", "It diffs the repo's manifests against the live cluster state.", "Any drift \u2014 someone ran kubectl edit directly, for instance \u2014 gets flagged or automatically reverted, depending on configuration."], "note": null}, {"type": "diagram", "part": "15 \u00b7 GitOps", "track": "ops", "title": "The pipeline, end to end", "svg": "<svg viewBox=\"0 0 900 100\" class=\"w-full\"><g font-family=\"Inter\" font-size=\"10\"><rect x=\"10\" y=\"30\" width=\"100\" height=\"45\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#E2E5EA\"/><text x=\"60\" y=\"57\" text-anchor=\"middle\" fill=\"#14181F\">Commit</text><rect x=\"130\" y=\"30\" width=\"100\" height=\"45\" rx=\"6\" fill=\"#FBF2E1\" stroke=\"#8A5A12\"/><text x=\"180\" y=\"57\" text-anchor=\"middle\" fill=\"#14181F\">Build+scan</text><rect x=\"250\" y=\"30\" width=\"100\" height=\"45\" rx=\"6\" fill=\"#FBF2E1\" stroke=\"#8A5A12\"/><text x=\"300\" y=\"57\" text-anchor=\"middle\" fill=\"#14181F\">Sign</text><rect x=\"370\" y=\"30\" width=\"100\" height=\"45\" rx=\"6\" fill=\"#FBECE8\" stroke=\"#A8412B\"/><text x=\"420\" y=\"57\" text-anchor=\"middle\" fill=\"#14181F\">Policy gate</text><rect x=\"490\" y=\"30\" width=\"100\" height=\"45\" rx=\"6\" fill=\"#E8F0EF\" stroke=\"#1D4E4B\"/><text x=\"540\" y=\"57\" text-anchor=\"middle\" fill=\"#14181F\">Deploy</text><rect x=\"610\" y=\"30\" width=\"120\" height=\"45\" rx=\"6\" fill=\"#E8F0EF\" stroke=\"#1D4E4B\"/><text x=\"670\" y=\"57\" text-anchor=\"middle\" fill=\"#14181F\">Runtime watch</text><rect x=\"750\" y=\"30\" width=\"140\" height=\"45\" rx=\"6\" fill=\"#FBECE8\" stroke=\"#A8412B\"/><text x=\"820\" y=\"50\" text-anchor=\"middle\" fill=\"#14181F\">Auto-isolate</text><text x=\"820\" y=\"63\" text-anchor=\"middle\" font-size=\"8\" fill=\"#4B5563\">+ page human</text></g><g stroke=\"#4B5563\" stroke-width=\"1.3\" marker-end=\"url(#gArrow)\"><line x1=\"110\" y1=\"52\" x2=\"128\" y2=\"52\"/><line x1=\"230\" y1=\"52\" x2=\"248\" y2=\"52\"/><line x1=\"350\" y1=\"52\" x2=\"368\" y2=\"52\"/><line x1=\"470\" y1=\"52\" x2=\"488\" y2=\"52\"/><line x1=\"590\" y1=\"52\" x2=\"608\" y2=\"52\"/><line x1=\"730\" y1=\"52\" x2=\"748\" y2=\"52\"/></g><defs><marker id=\"gArrow\" markerWidth=\"7\" markerHeight=\"7\" refX=\"3.5\" refY=\"3.5\" orient=\"auto\"><path d=\"M0,0 L7,3.5 L0,7 Z\" fill=\"#4B5563\"/></marker></defs></svg>", "note": "Every stage from Part 14's scanning to Part 20's incident response, as one continuous line."}, {"type": "concept", "part": "15 \u00b7 GitOps", "track": "sec", "title": "Keyless CI authentication, revisited", "bullets": ["A CI pipeline that deploys to a cluster needs cloud credentials \u2014 storing them as long-lived secrets in CI is the same anti-pattern flagged for workloads in Part 8.", "GitHub's OIDC token lets the runner request a short-lived cloud role directly: permissions: id-token: write, then aws-actions/configure-aws-credentials or google-github-actions/auth.", "No static keys stored anywhere, and the credential e
