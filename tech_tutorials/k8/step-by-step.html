xpires automatically after the job finishes."], "note": null, "deeper": "## The trust policy is the actual security boundary\n\n`permissions: id-token: write` only gets you a token \u2014 the cloud-side **trust policy** on the role you're assuming is what actually decides who can use it. This is where keyless auth quietly goes wrong:\n\n**A trust policy scoped too broadly:**\n```\n\"Condition\": {\n  \"StringLike\": { \"token.actions.githubusercontent.com:sub\": \"repo:my-org/*\" }\n}\n```\nThis trusts a token from **any** workflow in **any** repository under `my-org` \u2014 including a fork's pull-request workflow, if the trust condition doesn't also check the ref or exclude `pull_request` events specifically.\n\n**The safer pattern:**\n```\n\"Condition\": {\n  \"StringEquals\": { \"token.actions.githubusercontent.com:sub\":\n    \"repo:my-org/infra:ref:refs/heads/main\" }\n}\n```\nScoped to one repository, one branch \u2014 a workflow running against a pull request from a fork cannot assume this role, because its `sub` claim won't match.\n\n**The rule of thumb:** keyless auth removes the risk of a *leaked* credential; it does nothing about an *overly trusting* one. Audit the trust policy with the same scrutiny you'd give an RBAC ClusterRole."}, {"type": "concept", "part": "15 \u00b7 GitOps", "track": "ops", "title": "Progressive delivery, briefly", "bullets": ["Canary: route a small percentage of traffic to the new version first, watch metrics, then gradually increase.", "Blue-green: run both versions fully, switch traffic all at once, keep the old version ready for instant rollback.", "Both reduce blast radius compared to an all-at-once rolling update \u2014 the tradeoff is added complexity in routing and observability."], "note": null}, {"type": "quiz", "part": "15 \u00b7 GitOps", "track": "meta", "q": "What does permissions: id-token: write actually give a GitHub Actions workflow?", "options": ["Full repository admin access", "The ability to request a short-lived OIDC token to authenticate to a cloud provider", "Faster runner performance", "Access to all repository secrets"], "correct": 1, "explain": "It lets the runner request a signed OIDC token from GitHub, which a cloud provider can exchange for a short-lived credential \u2014 no stored long-lived keys required."}, {"type": "divider", "part": "15.5 \u00b7 Packaging", "track": "meta", "title": "Manifests don't stay simple for long", "sub": "Helm, Kustomize, and why 'just copy the YAML' stops scaling"}, {"type": "concept", "part": "15.5 \u00b7 Packaging", "track": "ops", "title": "Helm: templating plus a package format", "bullets": ["A chart bundles templated manifests with a values.yaml \u2014 one chart, many environments, by swapping values, not editing YAML by hand.", "helm upgrade tracks releases and supports rollback to a previous release, similar in spirit to a Deployment rollback but at the whole-application level.", "The tradeoff: Go template syntax embedded in YAML can get genuinely hard to read at scale."], "note": null}, {"type": "concept", "part": "15.5 \u00b7 Packaging", "track": "ops", "title": "Kustomize: overlays instead of templates", "bullets": ["No templating language \u2014 you keep plain, valid YAML as a 'base,' then layer 'overlays' that patch specific fields per environment.", "Built directly into kubectl (kubectl apply -k), so it requires no extra tooling to get started.", "Common split: which do you prefer \u2014 a single parameterized template (Helm) or composable patches on real YAML (Kustomize)? Many teams use both together."], "note": null}, {"type": "concept", "part": "15.5 \u00b7 Packaging", "track": "sec", "title": "Packaging doesn't bypass any control you've already learned", "bullets": ["A Helm chart from an untrusted repository is a supply-chain risk exactly like an untrusted base image \u2014 vet chart sources the same way you'd vet a base image registry.", "Admission control (Part 10) still applies to whatever a chart or overlay ultimately renders \u2014 templating happens client-side, before the API server ever sees the request."], "note": null}, {"type": "quiz", "part": "15.5 \u00b7 Packaging", "track": "meta", "q": "What's the core structural difference between Helm and Kustomize?", "options": ["Helm only works with GitOps, Kustomize doesn't", "Helm uses a templating language over values; Kustomize patches plain YAML with overlays, no templating", "They produce different Kubernetes API versions", "Kustomize requires a server-side controller, Helm doesn't"], "correct": 1, "explain": "Helm parameterizes templates via values.yaml; Kustomize keeps YAML valid throughout and layers patches on top \u2014 different philosophies for the same packaging problem."}, {"type": "divider", "part": "15.6 \u00b7 Backup & DR", "track": "meta", "title": "Because 'it's declarative in Git' doesn't cover everything", "sub": "Stateful data and the cluster version itself both need a plan"}, {"type": "concept", "part": "15.6 \u00b7 Backup & DR", "track": "ops", "title": "What GitOps doesn't back up", "bullets": ["Git holds your desired configuration \u2014 it does not hold your PersistentVolume data, your etcd snapshot, or in-flight state.", "Tools like Velero back up both Kubernetes object state and, via snapshots, the underlying volume data \u2014 the piece GitOps structurally can't cover."], "note": null}, {"type": "concept", "part": "15.6 \u00b7 Backup & DR", "track": "sec", "title": "etcd backup is a security control, not just an ops one", "bullets": ["An etcd snapshot is a full copy of cluster state, including all Secrets \u2014 back it up with the same access controls and encryption you'd apply to the live etcd.", "Test restores regularly. A backup you've never restored from is a hope, not a plan."], "note": null}, {"type": "concept", "part": "15.6 \u00b7 Backup & DR", "track": "ops", "title": "Cluster upgrades, the pattern", "bullets": ["Control plane first, then worker nodes \u2014 this order avoids nodes running a newer kubelet than the API server supports.", "Kubernetes supports a narrow version skew \u2014 kubelet can run up to three minor versions behind kube-apiserver (two, on kubelet versions older than 1.25) \u2014 this is why 'just upgrade whenever' silently breaks things eventually.", "Upgrade one node pool or node at a time in production, watching health, rather than all nodes simultaneously."], "note": null}, {"type": "concept", "part": "15.6 \u00b7 Backup & DR", "track": "sec", "title": "API deprecation is a security issue too", "bullets": ["Deprecated API versions are eventually removed entirely \u2014 manifests still referencing them will fail outright on upgrade, sometimes for security-relevant resources like PodSecurityPolicy (removed in 1.25).", "kubectl convert and deprecation warnings in kubectl apply output are there specifically so this doesn't surprise you during an actual upgrade window."], "note": null}, {"type": "quiz", "part": "15.6 \u00b7 Backup & DR", "track": "meta", "q": "Why can't GitOps alone serve as your backup and disaster recovery strategy?", "options": ["GitOps is inherently insecure", "Git holds desired configuration, not PersistentVolume data or etcd state \u2014 those need separate backup tooling", "GitOps only works for stateless apps entirely", "Git repositories can't be restored"], "correct": 1, "explain": "Git is a source of truth for configuration, not for stateful data or the cluster's own internal state \u2014 that gap is exactly what tools like Velero and etcd snapshots exist to close."}, {"type": "lab", "part": "15.6 \u00b7 Backup & DR", "track": "meta", "labnum": "0", "labname": "Revisit your Lab 0 cluster", "note": "A good exercise beyond this deck: take an etcd snapshot of your Lab 0 cluster, delete a resource, then practice restoring from that snapshot."}, {"type": "divider", "part": "16 \u00b7 Multi-tenancy", "track": "meta", "title": "Sharing one cluster safely across teams", "sub": "From soft boundaries to hard ones"}, {"type": "concept", "part": "16 \u00b7 Multi-tenancy", "track": "sec", "title": "Namespace isolation is a starting point, not a wall", "bullets": ["Namespaces scope names and RBAC \u2014 they do not, by themselves, isolate network traffic or resource consumption.", "You need NetworkPolicy for traffic isolation and ResourceQuota/LimitRange for resource isolation, layered on top of the namespace boundary.", "This combination is often called 'soft multi-tenancy' \u2014 good enough for trusted internal teams, not for mutually distrusting tenants."], "note": null}, {"type": "concept", "part": "16 \u00b7 Multi-tenancy", "track": "sec", "title": "When soft isn't enough", "bullets": ["Hard multi-tenancy usually means separate clusters per tenant, or a virtual-cluster technology (like vcluster) that gives each tenant their own control-plane view backed by shared infrastructure.", "The deciding question: could tenant A's actions ever affect tenant B's availability, data, or security posture? If yes and that's unacceptable, soft isolation isn't enough."], "note": null, "deeper": "## The real tradeoff: vcluster vs. separate clusters\n\n| | Namespace + NetworkPolicy | vcluster | Separate clusters |\n|---|---|---|---|\n| Isolation strength | Soft \u2014 shared control plane, shared etcd | Medium \u2014 tenant gets its own control-plane view, shared node capacity | Hard \u2014 fully separate everything |\n| Operational overhead | Lowest | Moderate \u2014 one host cluster, many virtual ones | Highest \u2014 N clusters to patch, monitor, upgrade |\n| Cost efficiency | Best \u2014 nodes fully shared | Good \u2014 nodes still shared, control planes are cheap to run virtually | Worst \u2014 capacity can't be shared across tenants at all |\n| Right for | Trusted internal teams | SaaS platforms selling tenant isolation without per-tenant cluster cost | Regulatory hard requirements, wildly different tenant trust levels |\n\n**The decision question that actually resolves this:** are you isolating *trust* (tenants shouldn't see each other) or isolating *blast radius* (a tenant's outage shouldn't affect another's availability)? vcluster solves the first well; it still shares underlying node capacity, so a noisy-neighbor resource problem can still cross tenant boundaries unless paired with strict ResourceQuotas per virtual cluster."}, {"type": "concept", "part": "16 \u00b7 Multi-tenancy", "track": "ops", "title": "ResourceQuota and LimitRange, working together", "bullets": ["ResourceQuota caps total consumption per namespace: total CPU, total memory, total object counts.", "LimitRange sets defaults and min/max per individual Pod or container within a namespace \u2014 so a Pod that forgets to set a request still gets one."], "note": null}, {"type": "concept", "part": "16 \u00b7 Multi-tenancy", "track": "ops", "title": "Namespaces do not nest", "bullets": ["There is no parent-child relationship between namespaces \u2014 team-a and team-a-staging are two flat, unrelated namespaces to Kubernetes, whatever your naming convention implies.", "Any hierarchy you want (billing rollups, inherited policy) has to be built and enforced by tooling on top, not by Kubernetes itself."], "note": null}, {"type": "quiz", "part": "16 \u00b7 Multi-tenancy", "track": "meta", "q": "Namespaces alone isolate which of these? (pick the most accurate)", "options": ["Network traffic between pods", "Resource consumption between teams", "Names and RBAC scope \u2014 nothing about traffic or resources by default", "Nothing at all"], "correct": 2, "explain": "Namespaces scope naming and RBAC. Traffic isolation needs NetworkPolicy; resource isolation needs ResourceQuota/LimitRange \u2014 both layered on top separately."}, {"type": "divider", "part": "17 \u00b7 Compliance", "track": "meta", "title": "Proving the controls exist, not just that they work", "sub": "What auditors actually check"}, {"type": "concept", "part": "17 \u00b7 Compliance", "track": "sec", "title": "Audit logging architecture", "bullets": ["Every request to the API server can be logged at a configurable level: None, Metadata (who/what/when, no body), Request (adds the request body), or RequestResponse (adds the response too).", "A sane baseline: Metadata for everything, RequestResponse specifically for Secrets access and RBAC changes \u2014 full logging everywhere is expensive and mostly noise.", "Logs need to ship off-cluster to immutable storage \u2014 an attacker with cluster access can otherwise erase their own trail."], "note": null}, {"type": "concept", "part": "17 \u00b7 Compliance", "track": "sec", "title": "CIS Benchmark vs. OWASP Top 10, the distinction that matters", "bullets": ["CIS Kubernetes Benchmark is a configuration checklist: is this specific setting correct, yes or no.", "OWASP Kubernetes Top 10 is a risk taxonomy: here are the categories of things that tend to go wrong across real deployments.", "You need both: CIS tells you what to configure; OWASP tells you what to watch for even when configuration looks fine."], "note": null}, {"type": "compare", "part": "17 \u00b7 Compliance", "track": "sec", "title": "Where SOC 2, PCI-DSS, and HIPAA actually bite", "cols": ["Framework", "Applies when", "K8s control it leans on"], "rows": [["SOC 2 Type II", "Almost every client engagement", "Audit logging, GitOps change tracking, RBAC reviews"], ["PCI-DSS v4.0", "Cardholder data in scope", "Namespace isolation, default-deny NetworkPolicy, etcd encryption"], ["HIPAA Security Rule", "PHI in scope", "Runtime detection, least-privilege RBAC, mTLS in transit"]], "note": null}, {"type": "quiz", "part": "17 \u00b7 Compliance", "track": "meta", "q": "What's the practical difference between CIS Benchmark and the OWASP Kubernetes Top 10?", "options": ["They're the same thing, different branding", "CIS checks configuration correctness; OWASP lists common risk categories", "CIS is AWS-only, OWASP is GKE-only", "OWASP replaced CIS entirely"], "correct": 1, "explain": "CIS is a pass/fail configuration checklist. OWASP's Top 10 is a taxonomy of risk categories \u2014 useful even when every CIS check passes."}, {"type": "code", "part": "17 \u00b7 Compliance", "track": "sec", "title": "Shaping an audit policy, concretely", "lang": "yaml", "body": "apiVersion: audit.k8s.io/v1\nkind: Policy\nrules:\n- level: RequestResponse\n  resources:\n  - group: \"\"\n    resources: [\"secrets\"]\n- level: Metadata\n  omitStages: [\"RequestReceived\"]", "note": "Secrets access gets full detail; everything else gets lightweight metadata-only logging \u2014 a realistic starting policy, not all-or-nothing."}, {"type": "lab", "part": "17 \u00b7 Compliance", "track": "meta", "labnum": "1", "labname": "Benchmark your cluster with kube-bench", "note": "Run an actual CIS Benchmark scan against your Lab 0 cluster and read the pass/fail output for yourself."}, {"type": "divider", "part": "18 \u00b7 Cloud specifics", "track": "meta", "title": "The same hardening, three different implementations", "sub": "Self-hosted, then GKE, then EKS"}, {"type": "concept", "part": "18 \u00b7 Cloud specifics", "track": "ops", "title": "Self-hosted: you own every default", "bullets": ["Nothing is hardened until you configure it \u2014 the API server, etcd, and every node start from a permissive baseline.", "kube-bench in a recurring job and a private control-plane network are the two highest-leverage first steps."], "note": null}, {"type": "concept", "part": "18 \u00b7 Cloud specifics", "track": "ops", "title": "Google GKE: Workload Identity Federation", "bullets": ["Lets Pods authenticate to Google Cloud APIs using a Kubernetes ServiceAccount mapped to a Google service account \u2014 no service account key files stored anywhere.", "Always on for Autopilot clusters; must be explicitly enabled per node pool on Standard clusters.", "Pair it with a private cluster and an authorized-networks allow-list on the control-plane endpoint."], "note": null}, {"type": "concept", "part": "18 \u00b7 Cloud specifics", "track": "ops", "title": "AWS EKS: Pod Identity vs. IRSA", "bullets": ["EKS Pod Identity is the current recommendation for new workloads on EC2 nodes \u2014 a simpler trust relationship than the older OIDC-federation approach.", "IRSA (IAM Roles for Service Accounts) remains relevant for Fargate workloads or clusters still mid-migration.", "Either way, the goal is the same as GKE's: Pods get scoped cloud permissions without static, long-lived credentials."], "note": null}, {"type": "quiz", "part": "18 \u00b7 Cloud specifics", "track": "meta", "q": "What's the current recommendation for giving new EC2-node workloads on EKS access to AWS APIs?", "options": ["Static IAM access keys as Kubernetes Secrets", "The shared EC2 instance profile for all Pods", "EKS Pod Identity", "Disabling IAM entirely"], "correct": 2, "explain": "EKS Pod Identity is the current recommendation for new EC2-node workloads \u2014 simpler trust setup than the older IRSA/OIDC pattern, which remains relevant mainly for Fargate."}, {"type": "concept", "part": "18 \u00b7 Cloud specifics", "track": "ops", "title": "Not every cluster needs to be this big", "bullets": ["k3s and k0s are lightweight, single-binary Kubernetes distributions built for edge devices, CI environments, and local development \u2014 same API, a fraction of the resource footprint.", "The hardening principles in this deck all still apply; what changes is which components are bundled or swapped (k3s replaces etcd with SQLite by default, for instance) \u2014 worth checking explicitly before assuming parity with a full cluster."], "note": null}, {"type": "divider", "part": "19 \u00b7 AI/ML", "track": "meta", "title": "Where the newest workloads change the oldest assumptions", "sub": "Same cluster, new failure modes"}, {"type": "concept", "part": "19 \u00b7 AI/ML", "track": "both", "title": "Why AI workloads don't fit the default mold", "bullets": ["GPU/TPU scheduling is fundamentally different from CPU scheduling \u2014 accelerators can't be fractionally shared the way CPU time can, by default.", "Training jobs often need large, long-lived, expensive-to-reproduce datasets \u2014 high-value targets that regular Pods rarely represent.", "Inference workloads increasingly include tool-using agents \u2014 code that can take real actions, not just return text."], "note": null}, {"type": "concept", "part": "19 \u00b7 AI/ML", "track": "sec", "title": "The threats, mapped to controls you already know", "bullets": ["Data poisoning \u2192 treat dataset provenance like a software supply chain: verify and pin sources, same principle as Part 14.", "Prompt injection into a tool-using agent \u2192 sandbox with gVisor/Kata, same isolation upgrade discussed in Part 13.", "GPU/TPU starvation \u2192 ResourceQuota scoped specifically to accelerator resources, same mechanism as Part 11, applied to a new resource type.", "Dataset exposure \u2192 mount ReadOnlyMany and encrypt at rest, same pattern as Part 7's storage hardening."], "note": null}, {"type": "concept", "part": "19 \u00b7 AI/ML", "track": "sec", "title": "Using AI/ML to defend the cluster, with a constraint", "bullets": ["eBPF-fed anomaly models can flag deviations from a cluster's normal syscall behavior that static rules would miss.", "AI-assisted drift detection can compare live state to GitOps source of truth continuously \u2014 but containment actions should stay human-approved until false-positive rates are proven over time.", "The pattern to avoid: letting an automated system both detect and unilaterally act on high-impact decisions before it's earned that trust."], "note": null}, {"type": "concept", "part": "19 \u00b7 AI/ML", "track": "ops", "title": "Model serving has its own operational shape", "bullets": ["Tools like KServe and Triton Inference Server package trained models as Kubernetes-native workloads, handling versioning, autoscaling to zero, and multi-model serving.", "Operationally these look like any other Deployment with an HPA \u2014 the AI-specific risks from this chapter still apply on top, not instead."], "note": null}, {"type": "quiz", "part": "19 \u00b7 AI/ML", "track": "meta", "q": "An AI inference workload uses tools that can execute shell commands. What's the primary defense against prompt-injection-driven misuse?", "options": ["Bigger GPU quota", "Sandbox the workload with gVisor or Kata Containers to contain what it can reach", "Disable logging to reduce noise", "Nothing \u2014 prompt injection can't be mitigated at the infrastructure layer"], "correct": 1, "explain": "Sandboxing limits the blast radius if the agent is manipulated into executing something unintended \u2014 the same isolation principle as any other untrusted workload."}, {"type": "divider", "part": "20 \u00b7 Incident response", "track": "meta", "title": "When prevention already failed", "sub": "Runbooks, severity, and what actually gets automated"}, {"type": "concept", "part": "20 \u00b7 Incident response", "track": "sec", "title": "Severity tiers drive different response speeds", "bullets": ["Critical (e.g., a shell spawned where one never should be): automated containment first, page immediately \u2014 seconds matter.", "High (e.g., unexpected outbound connection): automated flagging and rate-limiting, human review within the hour.", "Medium (e.g., config drift from GitOps): ticketed, no automatic action, reconciled on normal business cadence."], "note": null}, {"type": "concept", "part": "20 \u00b7 Incident response", "track": "sec", "title": "What belongs in a runbook", "bullets": ["The exact detection signal that triggers this runbook \u2014 not a vague description.", "The automated first response, if any, and its blast radius (isolate one pod vs. an entire namespace).", "The human escalation path and who owns the final containment decision."], "note": null}, {"type": "concept", "part": "20 \u00b7 Incident response", "track": "ops", "title": "Chaos engineering: finding failures before they find you", "bullets": ["Deliberately inject failure \u2014 kill a Pod, add network latency, exhaust a resource \u2014 in a controlled way, and observe whether your systems (and your team) respond as designed.", "The goal isn't to break things randomly; it's to validate assumptions about resilience under conditions you chose and can measure."], "note": null}, {"type": "concept", "part": "20 \u00b7 Incident response", "track": "ops", "title": "A postmortem template that actually gets used", "bullets": ["Timeline: what happened, in order, with timestamps \u2014 facts only, no blame language.", "Impact: who and what was affected, and for how long.", "Root cause(s): often more than one \u2014 the alert that did not fire is as much a cause as the bug that triggered it.", "Action items: each with an owner and a deadline, or it will not happen."], "note": null}, {"type": "concept", "part": "20 \u00b7 Incident response", "track": "both", "title": "Blameless postmortems, briefly", "bullets": ["Focus on what in the system allowed the incident, not who made a mistake \u2014 people don't intentionally cause outages, systems allow them to.", "A postmortem that produces zero action items didn't do its job, no matter how thorough the timeline is."], "note": null}, {"type": "quiz", "part": "20 \u00b7 Incident response", "track": "meta", "q": "Why does an automated Critical-severity response isolate network access rather than immediately killing the pod?", "options": ["Killing is always slower", "Isolating preserves the pod's state for forensic investigation while still stopping further damage", "It's a Kubernetes API limitation", "There's no meaningful difference"], "correct": 1, "explain": "Isolating (cutting network access) contains the threat while preserving the container's memory and filesystem state for investigation \u2014 killing it destroys that evidence."}, {"type": "divider", "part": "21 \u00b7 Advanced", "track": "meta", "title": "Teaching Kubernetes new tricks", "sub": "CRDs, webhooks, and going beyond one cluster"}, {"type": "concept", "part": "21 \u00b7 Advanced", "track": "ops", "title": "Custom Resource Definitions and Operators", "bullets": ["A CRD extends the Kubernetes API with your own object types \u2014 kubectl get mydatabases works exactly like kubectl get pods once registered.", "An Operator is a controller written specifically to manage a CRD, encoding operational knowledge (how to safely upgrade this database, how to fail over) directly into automated reconciliation."], "note": null}, {"type": "concept", "part": "21 \u00b7 Advanced", "track": "sec", "title": "Admission webhooks, the mechanics", "bullets": ["A webhook is just an HTTPS endpoint the API server calls during the admission chain, with a strict timeout \u2014 if it's slow or down, you choose fail-open or fail-closed per webhook.", "failurePolicy: Fail on a critical security webhook means a webhook outage blocks all matching requests rather than silently letting them through \u2014 usually the safer default for security policy."], "note": null}, {"type": "concept", "part": "21 \u00b7 Advanced", "track": "ops", "title": "Multi-cluster patterns, briefly", "bullets": ["Fleet management tools let you apply consistent policy and configuration across many clusters from one control point.", "Common drivers: blast-radius reduction (one cluster's failure doesn't take everything down), regulatory data-residency requirements, and multi-cloud redundancy."], "note": null}, {"type": "concept", "part": "21 \u00b7 Advanced", "track": "ops", "title": "Multi-cluster service mesh, briefly", "bullets": ["Some meshes (Istio, Linkerd) support federating identity and traffic policy across multiple clusters, so mTLS and authorization rules apply consistently even when a call crosses cluster boundaries.", "This is the natural next step after Part 16's single-cluster multi-tenancy, once 'separate clusters per tenant' becomes the isolation model."], "note": null}, {"type": "quiz", "part": "21 \u00b7 Advanced", "track": "meta", "q": "What does failurePolicy: Fail mean for a validating admission webhook?", "options": ["Requests are always rejected", "If the webhook is unreachable or times out, matching requests are rejected rather than allowed through", "The webhook retries forever", "It has no effect on behavior"], "correct": 1, "explain": "Fail-closed behavior: if the webhook can't be reached, the safer choice for security-critical policy is to block the request rather than silently admit it."}, {"type": "divider", "part": "22 \u00b7 Capstone", "track": "meta", "title": "Putting the whole request lifecycle back together", "sub": "Every part of this deck, in one flow"}, {"type": "concept", "part": "22 \u00b7 Capstone", "track": "both", "title": "The full lifecycle of kubectl apply -f deployment.yaml", "bullets": ["1. Authentication: the API server verifies who you are (cert, token, or OIDC).", "2. Authorization: RBAC checks whether that identity may perform this verb on this resource.", "3. Admission: mutating webhooks may modify the object; validating webhooks (Kyverno, PodSecurity) may reject it.", "4. Persistence: the object is written to etcd, encrypted at rest if you configured it.", "5. Reconciliation: the Deployment controller creates a ReplicaSet; the ReplicaSet controller creates Pods; the scheduler assigns nodes; kubelets pull images and start containers.", "6. Ongoing operation: probes, metrics, and Falco all watch continuously \u2014 this list never really finishes."], "note": null, "deeper": "## What actually comes back when a stage rejects the request\n\nEach checkpoint in the lifecycle fails with a distinct, recognizable signal \u2014 worth knowing so you can tell at a glance which stage rejected you:\n\n| Stage | Failure looks like |\n|---|---|\n| Authentication | `error: You must be logged in to the server (Unauthorized)` |\n| Authorization (RBAC) | `Error from server (Forbidden): ... is forbidden: User \"x\" cannot create resource \"y\"` |\n| Admission (validating) | `Error from server: admission webhook \"...\" denied the request: <your policy's message>` |\n| Admission (mutating, webhook down) | Either silently skipped (`failurePolicy: Ignore`) or `... failed calling webhook` (`failurePolicy: Fail`) |\n| etcd write conflict | `Error from server (Conflict): ... the object has been modified` |\n\n**Why this table earns a place in your muscle memory:** \"Forbidden\" and \"denied the request\" look similar at a glance but mean completely different things to fix \u2014 one is an RBAC change, the other is a policy exception or a genuinely non-compliant manifest. Misreading which stage failed is a common source of wasted debugging time."}, {"type": "concept", "part": "22 \u00b7 Capstone", "track": "sec", "title": "Defense in depth, mapped to everything you just covered", "bullets": ["Cloud layer: private endpoints, Workload Identity Federation / Pod Identity.", "Cluster layer: RBAC, admission control, audit logging, encrypted etcd.", "Container layer: minimal images, non-root, read-only filesystem, seccomp.", "Code layer: dependency scanning, signed images, SBOMs.", "Runtime layer: Falco, eBPF-based anomaly detection, sandboxed execution for the highest-risk workloads."], "note": null}, {"type": "diagram", "part": "22 \u00b7 Capstone", "track": "sec", "title": "The 4Cs, nested", "svg": "<svg viewBox=\"0 0 320 260\" class=\"w-full max-w-xs mx-auto\"><circle cx=\"160\" cy=\"140\" r=\"115\" fill=\"#F6F7F9\" stroke=\"#E2E5EA\"/><circle cx=\"160\" cy=\"140\" r=\"85\" fill=\"#FFFFFF\" stroke=\"#E2E5EA\"/><circle cx=\"160\" cy=\"140\" r=\"55\" fill=\"#E8F0EF\" stroke=\"#1D4E4B\"/><circle cx=\"160\" cy=\"140\" r=\"26\" fill=\"#1D4E4B\"/><text x=\"160\" y=\"35\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"12\" fill=\"#4B5563\">Cloud</text><text x=\"160\" y=\"65\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"12\" fill=\"#4B5563\">Cluster</text><text x=\"160\" y=\"95\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"12\" fill=\"#14181F\">Container</text><text x=\"160\" y=\"144\" text-anchor=\"middle\" font-family=\"Inter\" font-size=\"12\" fill=\"#FFFFFF\" font-weight=\"600\">Code</text></svg>", "note": "A breach at one ring should never automatically compromise the ring inside it."}, {"type": "compare", "part": "22 \u00b7 Capstone", "track": "meta", "title": "Every lab, at a glance", "cols": ["Lab", "What it proves", "Where it lives in this deck"], "rows": [["0 \u2014 Local cluster", "Your environment actually works", "Part 2"], ["1 \u2014 kube-bench", "A CIS Benchmark scan runs and reads correctly", "Part 17"], ["2 \u2014 Trivy", "A vulnerability gate actually fails a build", "Part 14"], ["3 \u2014 Kyverno", "Policy-as-code actually rejects a bad deploy", "Part 10"], ["4 \u2014 NetworkPolicy", "Default-deny actually blocks traffic", "Part 6"], ["5 \u2014 Falco", "Runtime detection actually catches a live event", "Part 13"]], "note": null}, {"type": "concept", "part": "22 \u00b7 Capstone", "track": "both", "title": "The maturity model, one more time", "bullets": ["Level 0 \u2014 Ad hoc: default configuration, no scanning, RBAC is mostly cluster-admin.", "Level 1 \u2014 Managed: scanning in CI, namespace-scoped RBAC, manual CIS checks before audits.", "Level 2 \u2014 Enforced: admission-time policy, default-deny networking, centralized audit logging.", "Level 3 \u2014 Optimized: automated, scoped runtime response, continuous drift detection against GitOps state."], "note": null}, {"type": "quiz", "part": "22 \u00b7 Capstone", "track": "meta", "q": "In the request lifecycle, which happens first: RBAC authorization or admission control?", "options": ["Admission control, always", "RBAC authorization \u2014 a request must be authorized before it ever reaches an admission webhook", "They run simultaneously", "Neither \u2014 only authentication matters"], "correct": 1, "explain": "The order is fixed: authenticate, then authorize (RBAC), then admission control. A request RBAC never approves never reaches a webhook at all."}, {"type": "quiz", "part": "22 \u00b7 Capstone", "track": "meta", "q": "Across this whole deck, which single idea shows up in the most different chapters \u2014 control loops, RBAC, NetworkPolicy, and admission control?", "options": ["Everything defaults to permissive until you explicitly restrict it", "Kubernetes requires a service mesh to be secure", "Namespaces fully isolate tenants", "Encryption is enabled by default everywhere"], "correct": 0, "explain": "From the flat network model to wildcard RBAC to unencrypted Secrets by default \u2014 permissive-by-default is the thread connecting nearly every hardening decision in this deck."}, {"type": "divider", "part": "Where to go next", "track": "meta", "title": "You've covered the map \u2014 now build on it", "sub": "The labs turn every concept here into something you ran yourself"}, {"type": "closing"}];

const TRACK_STYLE = {
  ops:  { label: 'Operational', cls: 'bg-tealsoft text-teal' },
  sec:  { label: 'Security',    cls: 'bg-rustsoft text-rust' },
  both: { label: 'Both',        cls: 'bg-ambersoft text-amber' },
  meta: { label: 'Checkpoint',  cls: 'bg-surface text-subink' }
};

let current = 0;
let quizScore = 0;
let quizAnswered = 0;

function trackBadge(track){
  const t = TRACK_STYLE[track] || TRACK_STYLE.meta;
  return `<span class="inline-block text-xs font-medium px-2 py-1 rounded ${t.cls} mb-4">${t.label}</span>`;
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function escMdCell(s){ return String(s||'').replace(/\|/g,'\\|').replace(/\n/g,' '); }

function trackLabelFor(track){
  const t = TRACK_STYLE[track] || TRACK_STYLE.meta;
  return t.label;
}

function slideToMarkdown(s, idx){
  const ctx = s.part ? `<!-- ${s.part} — slide ${idx+1} of ${SLIDES.length} -->\n\n` : `<!-- slide ${idx+1} of ${SLIDES.length} -->\n\n`;
  let body = '';
  switch(s.type){
    case 'title':
      body = `# ${document.title.replace(' — Interactive Deck','')}\n\nAn interactive walkthrough — ${SLIDES.length} slides.\n`;
      break;
    case 'divider':
      body = `## ${s.part}\n\n### ${s.title}\n\n${s.sub}\n`;
      break;
    case 'bridge':
      body = `> **${s.title}**\n>\n> ${s.body}\n`;
      break;
    case 'concept':
      body = `### ${s.title}\n\n*${trackLabelFor(s.track)}*\n\n`
           + s.bullets.map(b => `- ${b}`).join('\n')
           + (s.note ? `\n\n> ${s.note}` : '') + '\n';
      break;
    case 'code':
      body = `### ${s.title}\n\n*${trackLabelFor(s.track)}*\n\n\`\`\`${s.lang || ''}\n${s.body}\n\`\`\`\n`
           + (s.note ? `\n> ${s.note}\n` : '');
      break;
    case 'diagram':
      body = `### ${s.title}\n\n*${trackLabelFor(s.track)}*\n\n_(Diagram — see the interactive deck for the visual)_\n`
           + (s.note ? `\n> ${s.note}\n` : '');
      break;
    case 'compare': {
      const head = `| ${s.cols.join(' | ')} |`;
      const sep = `| ${s.cols.map(() => '---').join(' | ')} |`;
      const rows = s.rows.map(r => `| ${r.map(escMdCell).join(' | ')} |`).join('\n');
      body = `### ${s.title}\n\n${head}\n${sep}\n${rows}\n` + (s.note ? `\n> ${s.note}\n` : '');
      break;
    }
    case 'lab':
      body = `### Try it — Lab ${s.labnum}: ${s.labname}\n\n${s.note}\n\n_Full steps and verification commands are in the field manual's hands-on labs module._\n`;
      break;
    case 'quiz': {
      const opts = s.options.map((o,i) => `- [${i === s.correct ? 'x' : ' '}] ${o}`).join('\n');
      body = `### Checkpoint quiz\n\n**${s.q}**\n\n${opts}\n\n**Explanation:** ${s.explain}\n`;
      break;
    }
    case 'closing':
      body = `## Done\n\nCheckpoint quiz score this session: ${quizScore}/${quizAnswered}\n`;
      break;
    default:
      body = '';
  }
  return ctx + body;
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){ /* no-op */ }
  document.body.removeChild(ta);
}

function showCopyFeedback(success){
  const full = document.getElementById('copyMdLabel');
  const short = document.getElementById('copyMdLabelShort');
  const fullOriginal = 'Copy as Markdown';
  const shortOriginal = 'Copy';
  full.textContent = success ? 'Copied ✓' : 'Copy failed';
  short.textContent = success ? 'Copied ✓' : 'Failed';
  setTimeout(() => { full.textContent = fullOriginal; short.textContent = shortOriginal; }, 1500);
}

function copySlideMarkdown(){
  const md = slideToMarkdown(SLIDES[current], current);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(md).then(
      () => showCopyFeedback(true),
      () => { fallbackCopy(md); showCopyFeedback(true); }
    );
  } else {
    fallbackCopy(md);
    showCopyFeedback(true);
  }
}

function renderBullets(bullets){
  return `<ul class="space-y-3">${bullets.map(b=>`<li class="flex gap-3 text-ink leading-relaxed"><span class="text-teal mt-1.5 flex-shrink-0">&#9679;</span><span>${b}</span></li>`).join('')}</ul>`;
}

function renderSlide(s){
  if (s.type === 'title'){
    return `<div class="flex flex-col items-center justify-center text-center min-h-[55vh]">
      <p class="text-sm text-subink mb-4 tracking-wide">An interactive walkthrough</p>
      <h1 class="text-4xl sm:text-5xl font-semibold serif text-ink mb-6 max-w-2xl">Kubernetes, Step by Step</h1>
      <p class="text-subink max-w-xl leading-relaxed">${SLIDES.length} slides. Operational and Security perspectives, side by side. Checkpoint quizzes throughout. Hands-on labs correlated as you go.</p>
    </div>`;
  }
  if (s.type === 'closing'){
    return `<div class="flex flex-col items-center justify-center text-center min-h-[55vh]">
      <h1 class="text-3xl sm:text-4xl font-semibold serif text-ink mb-6 max-w-xl">That's the full picture.</h1>
      <p class="text-subink max-w-xl leading-relaxed mb-2">Your score this session: <span class="font-medium text-ink" id="finalScore"></span></p>
      <p class="text-subink max-w-xl leading-relaxed mb-6">Go run the labs for real — the <a href="./security-field-manual.html#module-08" class="text-teal font-medium underline">field manual has all six</a>, with verification steps for each.</p>
      <div class="flex flex-wrap items-center justify-center gap-3">
        <a href="./index.html" class="focus-ring text-xs font-medium text-teal border border-teal rounded-md px-3.5 py-2 hover:bg-tealsoft transition-colors">&larr; K8s Hub</a>
        <a href="./security-field-manual.html" class="focus-ring text-xs font-medium text-white bg-teal rounded-md px-3.5 py-2 hover:bg-[#163e3c] transition-colors">Security Field Manual &rarr;</a>
        <a href="./ai-training.html" class="focus-ring text-xs font-medium text-subink border border-line rounded-md px-3.5 py-2 hover:bg-surface transition-colors">AI Training Deck &rarr;</a>
      </div>
    </div>`;
  }
  if (s.type === 'divider'){
    return `<div class="flex flex-col justify-center min-h-[50vh]">
      <p class="text-sm font-medium text-teal mb-3">${esc(s.part)}</p>
      <h2 class="text-3xl sm:text-4xl font-semibold serif text-ink mb-4 max-w-2xl">${esc(s.title)}</h2>
      <p class="text-lg text-subink max-w-xl">${esc(s.sub)}</p>
    </div>`;
  }
  if (s.type === 'bridge'){
    return `<div class="flex flex-col justify-center min-h-[45vh] border-l-4 border-amber pl-6">
      <p class="text-xs font-medium text-amber mb-3">Switching lens</p>
      <h2 class="text-2xl sm:text-3xl font-semibold serif text-ink mb-4">${esc(s.title)}</h2>
      <p class="text-subink max-w-xl leading-relaxed">${esc(s.body)}</p>
    </div>`;
  }
  if (s.type === 'concept'){
    return `${trackBadge(s.track)}<h2 class="text-2xl sm:text-3xl font-semibold text-ink mb-6">${esc(s.title)}</h2>${renderBullets(s.bullets)}${s.note?`<p class="text-sm text-subink mt-6 pt-4 border-t border-line">${esc(s.note)}</p>`:''}`;
  }
  if (s.type === 'code'){
    return `${trackBadge(s.track)}<h2 class="text-2xl sm:text-3xl font-semibold text-ink mb-6">${esc(s.title)}</h2>
      <pre class="bg-ink text-white text-xs sm:text-sm mono p-5 rounded-lg overflow-x-auto leading-relaxed">${esc(s.body)}</pre>
      ${s.note?`<p class="text-sm text-subink mt-4">${esc(s.note)}</p>`:''}`;
  }
  if (s.type === 'diagram'){
    return `${trackBadge(s.track)}<h2 class="text-2xl sm:text-3xl font-semibold text-ink mb-6">${esc(s.title)}</h2>
      <div class="border border-line rounded-lg p-6 overflow-x-auto">${s.svg}</div>
      ${s.note?`<p class="text-sm text-subink mt-4">${esc(s.note)}</p>`:''}`;
  }
  if (s.type === 'compare'){
    const head = s.cols.map(c=>`<th class="p-3 font-medium border-b border-line text-left">${esc(c)}</th>`).join('');
    const rows = s.rows.map(r=>`<tr>${r.map(c=>`<td class="p-3 text-subink align-top">${esc(c)}</td>`).join('')}</tr>`).join('');
    return `${trackBadge(s.track)}<h2 class="text-2xl sm:text-3xl font-semibold text-ink mb-6">${esc(s.title)}</h2>
      <div class="overflow-x-auto border border-line rounded-lg"><table class="w-full text-sm border-collapse"><thead><tr class="bg-surface">${head}</tr></thead><tbody class="divide-y divide-line">${rows}</tbody></table></div>
      ${s.note?`<p class="text-sm text-subink mt-4">${esc(s.note)}</p>`:''}`;
  }
  if (s.type === 'lab'){
    return `<div class="border-2 border-teal rounded-xl p-8 bg-tealsoft">
      <p class="text-xs font-medium text-teal mb-2 uppercase tracking-wide">Try it — Lab ${esc(s.labnum)}</p>
      <h2 class="text-2xl font-semibold text-ink mb-3">${esc(s.labname)}</h2>
      <p class="text-ink leading-relaxed">${esc(s.note)}</p>
      <p class="text-sm text-subink mt-4">Full steps and verification commands are in the <a href="./security-field-manual.html#module-08" class="text-teal underline font-medium">field manual's hands-on labs module</a>.</p>
    </div>`;
  }
  if (s.type === 'quiz'){
    const opts = s.options.map((o,i)=>`
      <label class="flex items-center gap-3 p-3 rounded-md border border-line hover:bg-surface cursor-pointer text-sm text-ink">
        <input type="radio" name="quizOpt" value="${i}" style="accent-color:#1D4E4B">${esc(o)}
      </label>`).join('');
    return `<div class="border-2 border-ink/10 rounded-xl p-6 sm:p-8">
      <p class="text-xs font-medium text-subink mb-3 uppercase tracking-wide">Checkpoint quiz</p>
      <h2 class="text-xl sm:text-2xl font-semibold text-ink mb-6">${esc(s.q)}</h2>
      <div class="space-y-2 mb-5" id="quizOptions">${opts}</div>
      <button id="quizCheckBtn" class="focus-ring text-sm font-medium text-white bg-teal rounded-md px-4 py-2 hover:bg-[#163e3c] transition-colors">Check answer</button>
      <p id="quizFeedback" class="text-sm mt-4 hidden"></p>
    </div>`;
  }
  return '';
}

function partIndexMap(){
  const map = [];
  let lastPart = null;
  SLIDES.forEach((s,i)=>{
    if (s.type === 'divider' && s.part !== lastPart){
      map.push({part: s.part, title: s.title, index: i});
      lastPart = s.part;
    }
  });
  return map;
}

function buildJumpMenu(){
  const sel = document.getElementById('jumpSelect');
  const map = partIndexMap();
  sel.innerHTML = map.map(m => `<option value="${m.index}">${esc(m.part)}</option>`).join('');
  sel.addEventListener('change', () => { goTo(parseInt(sel.value,10)); });
}

function currentChapterLabel(i){
  let label = 'Kubernetes, Step by Step';
  for (const s of SLIDES.slice(0, i+1)){
    if (s.part) label = s.part;
  }
  return label;
}

function updateJumpSelectValue(i){
  const sel = document.getElementById('jumpSelect');
  const map = partIndexMap();
  let best = map[0];
  for (const m of map){ if (m.index <= i) best = m; else break; }
  if (best) sel.value = String(best.index);
}

function render(){
  const s = SLIDES[current];
  document.getElementById('slideStage').innerHTML = renderSlide(s);
  document.getElementById('slideCounter').textContent = `${current+1} / ${SLIDES.length}`;
  const topCounter = document.getElementById('topSlideCounter');
  if (topCounter) topCounter.textContent = `${current+1}/${SLIDES.length}`;
  const mobCounter = document.getElementById('mobileSlideCounter');
  if (mobCounter) mobCounter.textContent = `${current+1} / ${SLIDES.length}`;
  document.getElementById('progressBar').style.width = `${((current+1)/SLIDES.length)*100}%`;
  document.getElementById('chapterLabel').textContent = currentChapterLabel(current);
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === SLIDES.length - 1;
  const topPrev = document.getElementById('topPrevBtn');
  const topNext = document.getElementById('topNextBtn');
  if (topPrev) topPrev.disabled = current === 0;
  if (topNext) topNext.disabled = current === SLIDES.length - 1;
  updateJumpSelectValue(current);
  updateScoreLabel();

  if (s.deeper){
    const btn = document.createElement('button');
    btn.className = 'focus-ring mt-6 flex items-center gap-2 text-sm font-medium text-amber border border-amber/40 rounded-md px-3 py-2 hover:bg-ambersoft transition-colors';
    btn.innerHTML = `<svg viewBox="0 0 24 24" class="h-4 w-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 3.5"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg> Deeper insight`;
    btn.addEventListener('click', openDeeperModal);
    document.getElementById('slideStage').appendChild(btn);
  }

  if (s.type === 'quiz'){
    document.getElementById('quizCheckBtn').addEventListener('click', () => checkQuiz(s));
  }
  if (s.type === 'closing'){
    const el = document.getElementById('finalScore');
    if (el) el.textContent = `${quizScore} / ${quizAnswered} checkpoint questions`;
  }
}

function checkQuiz(s){
  const sel = document.querySelector('input[name="quizOpt"]:checked');
  const feedback = document.getElementById('quizFeedback');
  if (!sel){
    feedback.textContent = 'Pick an answer first.';
    feedback.className = 'text-sm mt-4 text-amber';
    feedback.classList.remove('hidden');
    return;
  }
  const isCorrect = parseInt(sel.value,10) === s.correct;
  feedback.textContent = (isCorrect ? 'Correct. ' : 'Not quite. ') + s.explain;
  feedback.className = 'text-sm mt-4 ' + (isCorrect ? 'text-teal' : 'text-rust');
  feedback.classList.remove('hidden');
  document.querySelectorAll('input[name="quizOpt"]').forEach(i=>i.disabled=true);
  const btn = document.getElementById('quizCheckBtn');
  btn.disabled = true;
  btn.classList.add('opacity-50','cursor-not-allowed');
  quizAnswered += 1;
  if (isCorrect) quizScore += 1;
  updateScoreLabel();
}

function updateScoreLabel(){
  const el = document.getElementById('quizScoreLabel');
  el.textContent = quizAnswered ? `Score: ${quizScore}/${quizAnswered}` : '';
}

function goTo(i){
  current = Math.max(0, Math.min(SLIDES.length - 1, i));
  render();
  const mainEl = document.getElementById('mainStage') || document.querySelector('main');
  if (mainEl) mainEl.scrollTop = 0;
  window.scrollTo(0, 0);
}

function openDeeperModal(){
  const s = SLIDES[current];
  if (!s.deeper) return;
  const html = (typeof marked !== 'undefined') ? marked.parse(s.deeper) : `<pre>${esc(s.deeper)}</pre>`;
  document.getElementById('deeperContent').innerHTML = html;
  document.getElementById('deeperModal').classList.remove('hidden');
}

function closeDeeperModal(){
  document.getElementById('deeperModal').classList.add('hidden');
}

document.getElementById('deeperCloseBtn').addEventListener('click', closeDeeperModal);
document.getElementById('deeperBackdrop').addEventListener('click', closeDeeperModal);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDeeperModal();
});
document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
const topPrev = document.getElementById('topPrevBtn');
const topNext = document.getElementById('topNextBtn');
if (topPrev) topPrev.addEventListener('click', () => goTo(current - 1));
if (topNext) topNext.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

// Dynamic viewport height for mobile browsers (especially Safari 100vh toolbar offset)
function setAppHeight() {
  document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
}
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', setAppHeight);
setAppHeight();

// Mobile touch swipe gestures (Swipe left -> Next, Swipe right -> Prev)
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const diffX = e.changedTouches[0].screenX - touchStartX;
  const diffY = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(diffX) > 45 && Math.abs(diffX) > Math.abs(diffY) * 1.3) {
    if (diffX < 0) {
      goTo(current + 1);
    } else {
      goTo(current - 1);
    }
  }
}, { passive: true });

buildJumpMenu();
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
