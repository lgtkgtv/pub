<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111726" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#blueGrad)" stroke-width="6" opacity="0.4" />

  <!-- Kubernetes Helm Wheel Icon -->
  <g transform="translate(256, 256)">
    <!-- Outer Ring -->
    <circle r="160" fill="none" stroke="url(#blueGrad)" stroke-width="16" opacity="0.9" />
    <!-- Center Hub -->
    <circle r="44" fill="#090d16" stroke="url(#blueGrad)" stroke-width="14" />
    <circle r="18" fill="#38bdf8" />

    <!-- 7 Spokes -->
    <!-- Spoke 1 (0 deg) -->
    <line x1="0" y1="-44" x2="0" y2="-160" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="0" cy="-160" r="16" fill="#38bdf8" />
    <!-- Spoke 2 (51.4 deg) -->
    <g transform="rotate(51.428)">
      <line x1="0" y1="-44" x2="0" y2="-160" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" />
      <circle cx="0" cy="-160" r="16" fill="#38bdf8" />
    </g>
    <!-- Spoke 3 (102.8 deg) -->
    <g transform="rotate(102.857)">
      <line x1="0" y1="-44" x2="0" y2="-160" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" />
      <circle cx="0" cy="-160" r="16" fill="#38bdf8" />
    </g>
    <!-- Spoke 4 (154.3 deg) -->
    <g transform="rotate(154.285)">
      <line x1="0" y1="-44" x2="0" y2="-160" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" />
      <circle cx="0" cy="-160" r="16" fill="#38bdf8" />
    </g>
    <!-- Spoke 5 (205.7 deg) -->
    <g transform="rotate(205.714)">
      <line x1="0" y1="-44" x2="0" y2="-160" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" />
      <circle cx="0" cy="-160" r="16" fill="#38bdf8" />
    </g>
    <!-- Spoke 6 (257.1 deg) -->
    <g transform="rotate(257.142)">
      <line x1="0" y1="-44" x2="0" y2="-160" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" />
      <circle cx="0" cy="-160" r="16" fill="#38bdf8" />
    </g>
    <!-- Spoke 7 (308.6 deg) -->
    <g transform="rotate(308.571)">
      <line x1="0" y1="-44" x2="0" y2="-160" stroke="url(#blueGrad)" stroke-width="14" stroke-linecap="round" />
      <circle cx="0" cy="-160" r="16" fill="#38bdf8" />
    </g>
  </g>
</svg>
